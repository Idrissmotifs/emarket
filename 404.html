<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>ZooDo</title>
<script>
/* Lien de boutique du type .../baba.net : on renvoie vers l'application avec le nom de la boutique. */
(function(){var p=location.pathname,base=p.indexOf('/emarket/')===0?'/emarket/':'/',s=p.slice(base.length).split('/')[0];
location.replace(base+(s&&s.indexOf('.')!==0?'?b='+encodeURIComponent(s):''))})();
</script></head><body><p>Ouverture de ZooDo…</p></body></html>
