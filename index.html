 commandes=[];recues=[];claims={};codes={};msgs=[];me=null;contact=null;if(!user)return;await loadM();

 $('#app').innerHTML=`${!q&&!cat?`<div class="hero"><h2>Achetez et vendez en toute simplicité</h2><p>Publiez vos produits gratuitement et trouvez des clients.</p><button class="btn acc sm" data-a="nav" data-v="sell">Vendre un produit</button><div class="pills"><span>Code de livraison à 5 chiffres</span><span>Commission de 1 % seulement</span></div></div>`:''}
 <div class="cats"><button class="ct ${!cat?'on':''}" data-a="cat" data-c=""><b>🛍️</b>Tout</button>${CATS.map(([c,e])=>`<button class="ct ${cat===c?'on':''}" data-a="cat" data-c="${c}"><b>${e}</b>${c}</button>`).join('')}</div>
 <div class="fl"><input id="pmin" type="number" inputmode="numeric" min="0" placeholder="Prix min (FCFA)" value="${esc(pmin)}" aria-label="Prix minimum"><input id="pmax" type="number" inputmode="numeric" min="0" placeholder="Prix max (FCFA)" value="${esc(pmax)}" aria-label="Prix maximum">

 <div id="adslot"></div><div id="spsec"></div><p class="cnt" id="cnt"></p><div class="grid" id="grid"></div>`;upd()}
function upd(){
 const t=norm(q),a=parseInt(pmin),b=parseInt(pmax);
 const l=vis().filter(p=>norm(p.nom+' '+p.categorie).includes(t)&&(!cat||p.categorie===cat)&&(isNaN(a)||p.prix>=a)&&(isNaN(b)||p.prix<=b));
 if(sort==='asc')l.sort((x,y)=>x.prix-y.prix);if(sort==='desc')l.sort((x,y)=>y.prix-x.prix);
 $('#cnt').textContent=l.length?l.length+' produit(s)':'';
 const ad=pubFor(q?'resultats':cat?'categorie':'accueil_banniere');$('#adslot').innerHTML=ad?adHtml(ad,'ban'):'';
 const sp=l.filter(isSp).sort((x,y)=>((x.id*SEED)%1009)-((y.id*SEED)%1009)).slice(0,6);
 $('#spsec').innerHTML=sp.length?`<div class="sec"><h3>⭐ Annonces sponsorisées</h3></div><div class="grid">${sp.map(cardHtml).join('')}</div><div class="sec"><h3>Tous les produits</h3></div>`:'';
 const it=l.map(cardHtml),mid=pubFor('entre_produits');if(mid&&it.length>=4)it.splice(4,0,`<div style="grid-column:1/-1">${adHtml(mid)}</div>`);
 $('#grid').innerHTML=l.length?it.join(''):'<div class="empty" style="grid-column:1/-1">Aucun produit trouvé.<br>Soyez le premier à publier une annonce !</div>'}

 const v=e||{nom:'',prix:'',quantite:1,categorie:CATS[0][0],etat:'Neuf',zone:'',description:''},il=e&&illim(e);
 $('#app').innerHTML=`<h2>${e?'Modifier mon annonce':'Vendre un produit'}</h2><div class="f">

<label>Description</label><textarea id="fd" rows="3" maxlength="500">${esc(v.description)}</textarea>
${!contact||(!contact.whatsapp&&!contact.telephone)?'<p class="note">📞 Pour être contacté par WhatsApp ou par téléphone, ajoutez vos numéros dans 👤 → Mes coordonnées.</p>':''}
<div class="warn">🚚 <b>Vous êtes responsable de la livraison.</b> Après paiement, vous avez 7 jours pour livrer. Si le produit n'est pas livré dans ce délai, sans justification valide de votre part, l'acheteur est remboursé automatiquement.</div>
<div id="fm"></div>
<button class="btn" id="pubb" data-a="pub">${e?'Enregistrer les modifications':'Publier mon annonce'}</button>${e?'<div class="acts"><button class="btn alt" data-a="canedit">Annuler</button></div>':''}</div>`;pv()}
function pv(){$('#pv').innerHTML=keepPh.map((u,i)=>`<div class="old"><img src="${esc(u)}" alt="Photo actuelle ${i+1}"><button data-a="rmold" data-i="${i}" aria-label="Retirer la photo actuelle ${i+1}">✕</button></div>`).join('')+photos.map((x,i)=>`<div><img src="${x.u}" alt="Photo ${i+1}"><button data-a="rmph" data-i="${i}" aria-label="Retirer la photo ${i+1}">✕</button></div>`).join('')}
function badge(s){return `<span class="st ${s==='Livrée'||STEPS.indexOf(s)>0?'ok':/Annul|Refus|Récl/.test(s)?'bad':''}">${esc(s)}</span>`}

function orders(){
 $('#app').innerHTML='<h2>Mes commandes</h2><br>'+(commandes.length?commandes.map(c=>`<div class="box"><div class="row" style="border:0"><h3>${esc(c.produit)}</h3><b>${fcfa(c.total)}</b></div>

 ${c.justif_retard&&ACTIVE.includes(c.statut)?`<p class="note">Le vendeur a justifié un retard : « ${esc(c.justif_retard)} ». Le délai a été prolongé. Si vous n'êtes pas d'accord, utilisez « Signaler un problème ».</p>`:''}

function shop(){
 const mine=produits.filter(p=>p.seller_id===user.id),rec=recues;
 let h=`<h2>Ma boutique</h2><div class="tabs"><button data-a="tab" data-t="annonces" class="${tab==='annonces'?'on':''}">Mes annonces (${mine.length})</button><button data-a="tab" data-t="recues" class="${tab==='recues'?'on':''}">Commandes reçues (${rec.length})</button><button data-a="tab" data-t="spons" class="${tab==='spons'?'on':''}">Sponsorisations</button></div>`;
 if(tab==='annonces')h+=mine.length?mine.map(p=>`<div class="box"><h3>${esc(p.nom)}</h3><div class="price">${fcfa(p.prix)}</div><p class="sub">Quantité : ${illim(p)?'illimitée':p.quantite} · ${esc(p.categorie)}${p.ventes>0?' · '+p.ventes+' vendu'+(p.ventes>1?'s':''):''}</p>${p.disponible===false?'<span class="st bad">Indisponible</span>':'<span class="st ok">Disponible</span>'}${isSp(p)?` <span class="st ok">⭐ Sponsorisé jusqu'au ${esc(dt(spOf(p).fin))}</span>`:''}
 <div class="acts"><button class="btn alt sm" data-a="open" data-id="${p.id}">Voir</button><button class="btn sm" data-a="edit" data-id="${p.id}">Modifier</button>${p.disponible!==false&&!isSp(p)&&!spons.some(x=>x.product_id==p.id&&x.statut==='En attente de paiement')?`<button class="btn acc sm" data-a="sp" data-id="${p.id}">⭐ Sponsoriser</button>`:''}<button class="btn alt sm" data-a="tog" data-id="${p.id}">${p.disponible===false?'Remettre en vente':'Marquer indisponible'}</button><button class="btn bad sm" data-a="del" data-id="${p.id}">Supprimer</button></div></div>`).join(''):'<div class="empty">Vous n\'avez pas encore d\'annonce.<br>Publiez votre premier produit.</div>';
 else if(tab==='spons')h+=sponsHtml();
 else if(!rec.length)h+='<div class="empty">Aucune commande reçue pour le moment.</div>';
 else{const v=rec.filter(c=>c.statut==='Livrée'),t=v.reduce((s,c)=>s+c.total,0),f=v.reduce((s,c)=>s+com(c),0);
  h+=`<div class="box" style="background:var(--soft)"><p>Ventes livrées : <b>${fcfa(t)}</b></p><p>Commissions E-Market (1 %) : ${fcfa(f)}</p><p>Montant pour vous : <b>${fcfa(t-f)}</b></p></div>`+rec.map(c=>`<div class="box"><div class="row" style="border:0"><h3>${esc(c.produit)}</h3><b>${fcfa(c.total)}</b></div>
  <p class="sub">${c.quantite} × ${fcfa(c.prix_unitaire)} · Client : ${esc(c.client)} (${esc(c.telephone)})</p><p class="sub">${esc(c.mode)}${c.adresse?' · '+esc(c.adresse):''}</p>${badge(c.statut)}${steps(c.statut)}
  <p class="note">Commission 1 % : ${fcfa(com(c))} · Vous recevrez : ${fcfa(c.total-com(c))}</p>
  ${ACTIVE.includes(c.statut)&&c.delai_fin?`<div class="warn">🚚 Vous êtes responsable de la livraison. À livrer avant le <b>${esc(dt(c.delai_fin))}</b>, sinon l'acheteur est remboursé automatiquement.</div>${c.justif_retard?`<p class="note">Votre justification : « ${esc(c.justif_retard)} »</p>`:`<div class="acts"><button class="btn alt sm" data-a="jus" data-id="${c.id}">Justifier un retard</button></div>`}`:''}
  ${claims[c.id]?`<div class="msg err">Problème signalé : « ${esc(claims[c.id].motif)} ». Commande suspendue le temps de l'examen.</div>`:''}
  <div class="acts">${(TR[c.statut]||[]).filter(s=>s!=='Paiement confirmé'||cfg.mode_test!=='false').map(s=>`<button class="btn ${s==='Refusée'?'bad':s==='Paiement confirmé'?'alt':''} sm" data-a="st" data-id="${c.id}" data-s="${s}">${LBL[s]}</button>`).join('')}</div>
  ${c.statut==='Paiement en attente'&&cfg.mode_test==='false'?'<p class="note">En attente de la confirmation du paiement par le prestataire de paiement.</p>':''}
  ${c.statut==='Paiement en attente'&&cfg.mode_test!=='false'?'<p class="note">Le bouton TEST sert à essayer l\'application. En vrai, le paiement sera confirmé par le prestataire de paiement, jamais par le vendeur.</p>':''}
  ${c.statut==='En livraison'?((c.tentatives||0)>=MAXT?'<div class="msg err">Commande bloquée : trop de codes incorrects. Contactez le support.</div>':`<p class="note">À la remise, demandez à l'acheteur son code à 5 chiffres.</p><div class="acts"><input id="cc${c.id}" inputmode="numeric" maxlength="5" placeholder="00000" style="width:130px;text-align:center;letter-spacing:4px" aria-label="Code de livraison"><button class="btn sm" data-a="conf" data-id="${c.id}">Confirmer la livraison</button></div>`):''}</div>`).join('')}
 $('#app').innerHTML=h}
function sponsHtml(){const l=spons.filter(x=>x.seller_id===user.id);
 return l.length?l.map(x=>{const p=P(x.product_id),f=SP.find(y=>y[0]===x.formule),st=x.statut==='Active'&&new Date(x.fin)<=now()?'Expirée':x.statut;
 return `<div class="box"><h3>${esc(p?p.nom:'Annonce')}</h3><p class="sub">Formule : ${esc(f?f[1]:x.formule)} · ${fcfa(x.montant)}</p><span class="st ${st==='Active'?'ok':st==='En attente de paiement'?'':'bad'}">${esc(st)}</span>
 ${x.debut?`<p class="sub">Du ${esc(dt(x.debut))} au ${esc(dt(x.fin))}</p>`:''}
 ${st==='En attente de paiement'?`<p class="note">Paiement en attente. Votre annonce sera sponsorisée après confirmation du paiement. Demande n° ${x.id}.</p><div class="acts"><button class="btn bad sm" data-a="spx" data-id="${x.id}">Annuler la demande</button></div>`:''}
 ${st==='Active'?'<p class="note">Votre annonce est maintenant sponsorisée.</p>':''}${st==='Expirée'?'<p class="note">Votre sponsorisation a expiré.</p>':''}
 ${['Expirée','Annulée','Paiement échoué'].includes(st)&&p&&p.disponible!==false&&!isSp(p)?`<div class="acts"><button class="btn acc sm" data-a="sp" data-id="${p.id}">⭐ Sponsoriser à nouveau</button></div>`:''}</div>`}).join(''):'<div class="empty">Aucune sponsorisation pour le moment.<br>Depuis « Mes annonces », touchez « Sponsoriser ».</div>'}
const cnt=()=>{$('#cn').textContent=cart.reduce((s,x)=>s+x.q,0)};
const saveCart=()=>{try{localStorage.setItem('em_panier',JSON.stringify(cart))}catch(e){}cnt()};
function cartItems(){const l=cart.map(i=>({p:P(i.id),q:i.q})).filter(x=>x.p&&x.p.disponible!==false&&x.p.quantite>0);l.forEach(x=>x.q=Math.min(x.q,x.p.quantite));return l}
function cartView(){const l=cartItems(),t=l.reduce((s,x)=>s+x.p.prix*x.q,0);
 $('#app').innerHTML='<h2>Mon panier</h2><br>'+(l.length?l.map(x=>`<div class="box ci"><div class="pic">${pic(x.p)}</div><div style="flex:1;min-width:0"><h3>${esc(x.p.nom)}</h3><div class="price">${fcfa(x.p.prix)}</div><div class="qty"><button data-a="cq" data-id="${x.p.id}" data-d="-1" aria-label="Moins">−</button><b>${x.q}</b><button data-a="cq" data-id="${x.p.id}" data-d="1" aria-label="Plus">+</button><button class="btn bad sm" data-a="crm" data-id="${x.p.id}" style="margin-left:auto">Retirer</button></div></div></div>`).join('')+`<div class="box"><div class="row" style="border:0"><b>Total</b><b>${fcfa(t)}</b></div><p class="note">Chaque produit devient une commande séparée, avec son propre code de livraison. Frais de livraison non inclus.</p><div class="warn">🛡️ Le vendeur est responsable de la livraison. Sans livraison dans le délai, et sans justification valide, votre argent vous est reversé.</div><button class="btn acc" data-a="cgo">Commander</button></div>`:'<div class="empty">Votre panier est vide.<br>Ajoutez des produits depuis l\'accueil.</div>')}
function cartForm(){const l=cartItems(),t=l.reduce((s,x)=>s+x.p.prix*x.q,0);
 sheet(`<div class="f"><h2>Finaliser la commande</h2><p>${l.length} produit(s) · ${fcfa(t)}</p><label>Votre nom</label><input id="bn" maxlength="60"><label>Téléphone</label><input id="bt" type="tel" maxlength="20"><label>Mode de réception</label><select id="bm"><option>Livraison</option><option>Remise en main propre</option></select><div id="bad"><label>Adresse de livraison</label><input id="ba" maxlength="120"></div><label>Moyen de paiement</label><select><option>Mobile Money (simulation)</option></select><div id="bmsg"></div><br><button class="btn" data-a="cok">Confirmer la commande</button><div class="acts"><button class="btn alt" data-a="close">Retour</button></div></div>`);
 $('#bm').onchange=()=>$('#bad').style.display=$('#bm').value==='Livraison'?'block':'none'}

/* ---------- Messagerie ---------- */
async function loadM(){
 const [p,m]=await Promise.all([sb.from('profiles').select('*').eq('id',user.id).maybeSingle(),sb.from('messages').select('*').order('created_at',{ascending:true}).limit(500)]);
 me=p.data||null;msgs=m.data||[];
 const ids=[...new Set(msgs.flatMap(x=>[x.buyer_id,x.seller_id]))];
 if(ids.length){const r=await sb.from('profiles').select('id,nom,boutique').in('id',ids);names={};(r.data||[]).forEach(x=>names[x.id]=x.boutique||x.nom||'Utilisateur')}
}
function threads(){const m={};msgs.forEach(x=>{const k=x.product_id+'|'+x.buyer_id;(m[k]=m[k]||{pid:x.product_id,buyer:x.buyer_id,seller:x.seller_id,produit:x.produit}).last=x});return Object.values(m).sort((a,b)=>new Date(b.last.created_at)-new Date(a.last.created_at))}
function inbox(){const l=threads();
 $('#app').innerHTML='<h2>Messages</h2><br>'+(l.length?l.map(t=>{const o=t.buyer===user.id?t.seller:t.buyer;return `<button class="card box" data-a="chat" data-p="${t.pid}" data-b="${t.buyer}"><h3>${esc(names[o]||'Utilisateur')} · ${esc(t.produit)}</h3><p class="sub">${t.last.sender_id===user.id?'Vous : ':''}${esc(t.last.texte.slice(0,60))}</p><p class="sub">${esc(dt(t.last.created_at))}</p></button>`}).join(''):'<div class="empty">Aucun message.<br>Ouvrez un produit et touchez « Contacter le vendeur ».</div>')}
const chatThread=()=>msgs.filter(x=>x.product_id==chat.pid&&x.buyer_id===chat.buyer);
function chatHtml(){const l=chatThread();return l.length?l.map(x=>`<div class="bub ${x.sender_id===user.id?'me':''}">${esc(x.texte)}<small>${esc(dt(x.created_at))}</small></div>`).join(''):'<div class="empty">Écrivez votre premier message.</div>'}
function chatView(){if(!chat){view='inbox';return inbox()}
 const l=chatThread(),pr=P(chat.pid),seller=pr?pr.seller_id:(l[0]&&l[0].seller_id),o=chat.buyer===user.id?seller:chat.buyer;
 $('#app').innerHTML=`<button class="btn alt sm" data-a="nav" data-v="inbox">← Messages</button><h2 style="margin-top:10px">${esc(names[o]||(pr&&pr.vendeur)||'Conversation')}</h2><p class="sub">À propos de : ${esc(pr?pr.nom:(l[0]?l[0].produit:''))}</p>
 <div class="chat" id="cl">${chatHtml()}</div><div class="cin"><input id="ct" maxlength="500" placeholder="Votre message…" aria-label="Message"><button class="btn" data-a="send">Envoyer</button></div><p class="note">Ne payez jamais en dehors de la plateforme.</p>`;
 const c=$('#cl');c.scrollTop=c.scrollHeight;
 pollT=setInterval(async()=>{try{await loadM();const c=$('#cl');if(c&&view==='chat'){const end=c.scrollHeight-c.scrollTop-c.clientHeight<60;c.innerHTML=chatHtml();if(end)c.scrollTop=c.scrollHeight}}catch(e){}},4000)}

  sb.from('claims').select('*, orders(produit,total,client,telephone,statut)').order('created_at',{ascending:false}).limit(30),
  sb.from('profiles').select('*').order('created_at',{ascending:false}).limit(50),
  sb.from('admin_log').select('*').order('created_at',{ascending:false}).limit(15)]);
 adm={st:st.data||{},cl:cl.data||[],us:us.data||[],lg:lg.data||[]};
}

 if(!adm){$('#app').innerHTML='<div class="empty">Chargement…</div>';loadAdm().then(()=>{if(view==='admin')adminView()}).catch(x=>toast(x.message));return}

 $('#app').innerHTML=`<h2>Espace administrateur</h2><br><div class="stat"><div><b>${s.utilisateurs||0}</b>Utilisateurs</div><div><b>${s.vendeurs||0}</b>Vendeurs</div><div><b>${s.produits||0}</b>Produits</div><div><b>${s.commandes||0}</b>Commandes</div><div><b>${fcfa(s.ventes||0)}</b>Ventes livrées</div><div><b>${fcfa(s.commissions||0)}</b>Commissions (1 %)</div></div>
 <br><h3>Sponsorisations à confirmer (${pend.length})</h3><p class="note">Une annonce n'est sponsorisée qu'après confirmation du paiement. Actives en ce moment : ${act.length}.</p><br>${pend.length?pend.map(x=>{const p=P(x.product_id),f=SP.find(y=>y[0]===x.formule);return `<div class="box"><div class="row" style="border:0"><h3>${esc(p?p.nom:'Annonce')}</h3><b>${fcfa(x.montant)}</b></div><p class="sub">${esc(f?f[1]:x.formule)} · ${esc(p?p.vendeur:'')} · demande n° ${x.id} · ${esc(dt(x.created_at))}</p><div class="acts"><button class="btn sm" data-a="saa" data-id="${x.id}">Paiement reçu : activer</button></div></div>`}).join(''):'<div class="empty">Aucune demande en attente.</div>'}
 <br><h3>Gestion des publicités (${pubs.length})</h3><div class="acts"><button class="btn acc sm" data-a="pbn">➕ Ajouter une publicité</button></div><br>${pubs.length?pubs.map(a=>`<div class="box"><div class="row" style="border:0"><h3>${esc(a.titre)}</h3><span class="st ${pst(a)==='Active'?'ok':pst(a)==='Programmée'?'':'bad'}">${pst(a)}</span></div><p class="sub">${esc(a.entreprise)} · ${esc(POS[a.emplacement]||a.emplacement)}</p><p class="sub">Du ${esc(new Date(a.debut).toLocaleDateString('fr-FR'))} au ${esc(new Date(a.fin).toLocaleDateString('fr-FR'))}</p><div class="acts"><button class="btn alt sm" data-a="pbe" data-id="${a.id}">Modifier</button><button class="btn alt sm" data-a="pbt" data-id="${a.id}">${a.actif?'Désactiver':'Réactiver'}</button><button class="btn bad sm" data-a="pbd" data-id="${a.id}">Supprimer</button></div></div>`).join(''):'<div class="empty">Aucune publicité.</div>'}
 <br><h3>Réclamations à traiter (${open.length})</h3><br>${open.length?open.map(c=>`<div class="box"><div class="row" style="border:0"><h3>${esc(c.orders?c.orders.produit:'Commande')}</h3><b>${fcfa(c.orders?c.orders.total:0)}</b></div><p class="sub">Client : ${esc(c.orders?c.orders.client:'')} (${esc(c.orders?c.orders.telephone:'')})</p><div class="msg err">« ${esc(c.motif)} »</div><p class="sub">${esc(dt(c.created_at))}</p><div class="acts"><button class="btn sm" data-a="adc" data-id="${c.id}" data-x="rembourser">Rembourser l'acheteur</button><button class="btn alt sm" data-a="adc" data-id="${c.id}" data-x="rejeter">Rejeter</button></div></div>`).join(''):'<div class="empty">Aucune réclamation en attente.</div>'}
 <h3>Annonces récentes</h3><br>${produits.slice(0,20).map(p=>`<div class="box"><h3>${esc(p.nom)}</h3><p class="sub">${fcfa(p.prix)} · ${esc(p.vendeur)} · ${p.disponible===false?'Désactivée':'Active'}</p><div class="acts"><button class="btn alt sm" data-a="apr" data-id="${p.id}" data-x="desactiver">Désactiver</button><button class="btn bad sm" data-a="apr" data-id="${p.id}" data-x="supprimer">Supprimer</button></div></div>`).join('')||'<div class="empty">Aucune annonce.</div>'}
 <h3>Comptes</h3><br>${adm.us.map(u=>`<div class="box"><div class="row" style="border:0"><span>${esc(u.nom||'—')}${u.boutique?' · '+esc(u.boutique):''}${u.role==='admin'?' (admin)':''}</span>${u.suspendu?'<span class="st bad">Suspendu</span>':''}</div>${u.id!==user.id&&u.role!=='admin'?`<div class="acts"><button class="btn ${u.suspendu?'alt':'bad'} sm" data-a="asp" data-id="${u.id}" data-x="${u.suspendu?'0':'1'}">${u.suspendu?'Réactiver':'Suspendre'}</button></div>`:''}</div>`).join('')}
 <h3>Journal des actions</h3><br>${adm.lg.length?adm.lg.map(l=>`<p class="sub">${esc(dt(l.created_at))} · ${esc(l.action)} · ${esc(l.cible||'')}</p>`).join(''):'<p class="sub">Aucune action pour le moment.</p>'}`}

function adForm(id){const a=id?pubs.find(x=>x.id==id):null,d=x=>{if(!x)return '';const y=new Date(x);return new Date(y.getTime()-y.getTimezoneOffset()*60000).toISOString().slice(0,10)},
 v=a||{entreprise:'',titre:'',description:'',lien:'',debut:null,fin:null,actif:true,emplacement:'accueil_banniere'};
 sheet(`<div class="f"><h2>${a?'Modifier la publicité':'Ajouter une publicité'}</h2>
 <label>Nom de l'entreprise</label><input id="pe" maxlength="80" value="${esc(v.entreprise)}">
 <label>Titre</label><input id="pt" maxlength="100" value="${esc(v.titre)}">
 <label>Description</label><textarea id="pd" rows="2" maxlength="300">${esc(v.description||'')}</textarea>
 <label>Image ou bannière ${a&&a.image_url?'(laisser vide pour garder l\'actuelle)':''}</label><input id="pi" type="file" accept="image/*">
 <label>Lien de destination (https://…, facultatif)</label><input id="pl" type="url" inputmode="url" maxlength="300" value="${esc(v.lien||'')}">
 <div class="two"><div><label>Début</label><input id="pdb" type="date" value="${d(v.debut)||d(new Date())}"></div><div><label>Fin</label><input id="pdf" type="date" value="${d(v.fin)}"></div></div>
 <label>Emplacement</label><select id="pp">${Object.entries(POS).map(([k,l])=>`<option value="${k}" ${v.emplacement===k?'selected':''}>${l}</option>`).join('')}</select>
 <label style="display:flex;gap:8px;align-items:center;margin-top:8px"><input id="pa" type="checkbox" ${v.actif?'checked':''} style="width:auto"> Publicité active</label>
 <div id="pm"></div><button class="btn" data-a="pbs" data-id="${a?a.id:''}">Enregistrer</button><div class="acts"><button class="btn alt" data-a="close">Annuler</button></div></div>`)}

/* ---------- Fenêtres ---------- */
function sheet(h){$('#sheet').innerHTML=h?`<div class="sheet" data-a="bg"><div>${h}</div></div>`:''}
function authForm(m){m=m||'in';
 sheet(`<div class="f"><h2>${m==='in'?'Connexion':'Créer un compte'}</h2><div class="tabs"><button data-a="am" data-m="in" class="${m==='in'?'on':''}">Connexion</button><button data-a="am" data-m="up" class="${m==='up'?'on':''}">Inscription</button></div>
 <label>E-mail</label><input id="ae" type="email" autocomplete="email"><label>Mot de passe (8 caractères minimum)</label><input id="ap" type="password" autocomplete="${m==='in'?'current-password':'new-password'}">
 ${m==='up'?'<label>Votre nom</label><input id="an" maxlength="60"><label>Nom de boutique (facultatif)</label><input id="ab" maxlength="40">':''}
 <div id="amsg"></div><br><button class="btn" data-a="${m==='in'?'login':'signup'}">${m==='in'?'Se connecter':'Créer mon compte'}</button><div class="acts"><button class="btn alt" data-a="close">Fermer</button></div></div>`)}
function openP(id){const p=P(id),ok=p.quantite>0&&p.disponible!==false;
 sheet(`<div class="big" id="big">${pic(p)}</div>${p.photos&&p.photos.length>1?`<div class="th">${p.photos.map((u,i)=>`<img src="${esc(u)}" class="${i?'':'on'}" data-a="g" data-id="${p.id}" data-i="${i}" alt="Photo ${i+1}">`).join('')}</div>`:''}
 <h2>${esc(p.nom)}</h2>${isSp(p)?'<span class="tag spo">⭐ Sponsorisé</span>':''}<div class="price" style="font-size:22px">${fcfa(p.prix)}</div><p>${esc(p.description)}</p>
 <div class="row"><span class="sub">Catégorie</span><span>${esc(p.categorie)}</span></div><div class="row"><span class="sub">État</span><span>${esc(p.etat)}</span></div>
 <div class="row"><span class="sub">Disponibilité</span><span>${ok?stk(p):'Indisponible'}</span></div><div class="row"><span class="sub">Vendeur</span><span>${esc(p.vendeur)}</span></div><div class="row"><span class="sub">Zone</span><span>${esc(p.zone||'—')}</span></div>
 ${p.ventes>0?`<div class="row"><span class="sub">Vendus</span><span>${p.ventes}</span></div>`:''}
 <div class="warn">🛡️ <b>Achat protégé :</b> si le vendeur ne livre pas dans le délai prévu, sans justification valide, votre argent vous est reversé.</div>
 <div class="acts"><button class="btn acc" data-a="buy" data-id="${p.id}" ${ok?'':'disabled'}>Acheter</button><button class="btn" data-a="add" data-id="${p.id}" ${ok?'':'disabled'}>Ajouter au panier</button><button class="btn alt" data-a="contact" data-id="${p.id}">Contacter le vendeur</button><button class="btn wa" data-a="wa" data-id="${p.id}">💬 Contacter sur WhatsApp</button><button class="btn alt" data-a="tel" data-id="${p.id}">📞 Appeler le vendeur</button><button class="btn alt" data-a="close">Fermer</button></div>`)}
function buyForm(id){const p=P(id);
 sheet(`<div class="f"><h2>Passer commande</h2><p>${esc(p.nom)} · ${fcfa(p.prix)}</p>
 <label>Quantité</label><input id="bq" type="number" inputmode="numeric" min="1" max="${p.quantite}" value="1">
 <label>Votre nom</label><input id="bn" maxlength="60"><label>Téléphone</label><input id="bt" type="tel" maxlength="20">
 <label>Mode de réception</label><select id="bm"><option>Livraison</option><option>Remise en main propre</option></select>
 <div id="bad"><label>Adresse de livraison</label><input id="ba" maxlength="120"></div>
 <label>Moyen de paiement</label><select><option>Mobile Money (simulation)</option></select>
 <div class="box" style="margin-top:14px"><div class="row" style="border:0"><b>Total</b><b id="bto">${fcfa(p.prix)}</b></div><p class="note">Frais de livraison éventuels non inclus, à préciser avec le vendeur.</p></div>
 <div class="warn">🛡️ Le vendeur est responsable de la livraison. En cas de non-livraison ou de délai dépassé sans justification valide, votre argent vous est reversé.</div>
 <div id="bmsg"></div><button class="btn" data-a="ok" data-id="${p.id}">Confirmer la commande</button><div class="acts"><button class="btn alt" data-a="open" data-id="${p.id}">Retour</button></div></div>`);
 $('#bq').oninput=()=>$('#bto').textContent=fcfa(p.prix*Math.max(0,parseInt($('#bq').value)||0));
 $('#bm').onchange=()=>$('#bad').style.display=$('#bm').value==='Livraison'?'block':'none'}

/* ---------- Photos ---------- */
const im=f=>new Promise((ok,ko)=>{const u=URL.createObjectURL(f),i=new Image();i.onload=()=>{URL.revokeObjectURL(u);ok(i)};i.onerror=()=>ko();i.src=u});
async function shrink(f){const i=await im(f),r=Math.min(1,900/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(i.width*r));c.height=Math.max(1,Math.round(i.height*r));c.getContext('2d').drawImage(i,0,0,c.width,c.height);
 return new Promise((ok,ko)=>c.toBlob(b=>b?ok(b):ko(),'image/jpeg',.75))}
async function addPhotos(inp){let n=0;for(const f of [...inp.files].slice(0,Math.max(0,MAXP-photos.length-keepPh.length))){try{const b=await shrink(f);photos.push({b,u:URL.createObjectURL(b)});pv()}catch(e){n++}}
 if(n)toast(n+' photo(s) non chargée(s).');inp.value=''}

/* ---------- Actions ---------- */
const need=()=>{if(!user){authForm('in');return false}if(me&&me.suspendu){toast('Votre compte est suspendu. Contactez le support.');return false}return true};
document.addEventListener('click',async e=>{const t=e.target.closest('[data-a]');if(!t)return;const a=t.dataset.a,id=t.dataset.id;
 const er=(el,m)=>{$(el).innerHTML=`<div class="msg err">${esc(m)}</div>`};
 try{
 if(a==='bg'){if(e.target===t)sheet('');return}
 if(a==='close')sheet('');
 else if(a==='nav'){sheet('');const v=t.dataset.v;if(['sell','orders','shop','inbox'].includes(v)&&!user){authForm('in');return}if(v==='sell'&&view!=='sell'){editId=null;keepPh=[];photos=[]}view=v;render()}
 else if(a==='theme'){const r=document.documentElement,cur=r.dataset.theme||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');r.dataset.theme=cur==='dark'?'light':'dark'}
 else if(a==='acct'){if(!user)authForm('in');else sheet(`<h2>Mon compte</h2><p class="sub">${esc(user.email)}</p><div class="acts">${isAdm()?'<button class="btn" data-a="adm">🛡️ Espace administrateur</button>':''}<button class="btn alt" data-a="coord">📞 Mes coordonnées</button><button class="btn bad" data-a="logout">Se déconnecter</button><button class="btn alt" data-a="close">Fermer</button></div>`)}
 else if(a==='am')authForm(t.dataset.m);
 else if(a==='login'){const {error}=await sb.auth.signInWithPassword({email:$('#ae').value.trim(),password:$('#ap').value});if(error)return er('#amsg',error.message==='Invalid login credentials'?'E-mail ou mot de passe incorrect.':error.message);sheet('');toast('Connecté !')}
 else if(a==='signup'){const em=$('#ae').value.trim(),pw=$('#ap').value,nm=$('#an').value.trim();
  if(!em)return er('#amsg','Entrez votre e-mail.');if(pw.length<8)return er('#amsg','Mot de passe : 8 caractères minimum.');if(!nm)return er('#amsg','Entrez votre nom.');
  const {data,error}=await sb.auth.signUp({email:em,password:pw,options:{data:{nom:nm,boutique:$('#ab').value.trim()}}});
  if(error)return er('#amsg',error.message);
  if(!data.session){$('#amsg').innerHTML='<div class="msg">Compte créé. Vérifiez votre e-mail pour confirmer, puis connectez-vous.</div>';return}
  sheet('');toast('Compte créé, bienvenue !')}
 else if(a==='logout'){await sb.auth.signOut();sheet('');view='home';toast('Déconnecté')}
 else if(a==='srch'){q=$('#q').value;if(view!=='home'){view='home';render()}else upd()}
 else if(a==='cat'){cat=t.dataset.c;home();nav()}
 else if(a==='open')openP(id);
 else if(a==='g'){const p=P(id);$('#big').innerHTML=pic(p,+t.dataset.i);document.querySelectorAll('.th img').forEach(m=>m.classList.toggle('on',m===t))}
 else if(a==='contact'){if(!need())return;const p=P(id);if(p.seller_id===user.id)return toast('C\'est votre propre annonce.');chat={pid:String(p.id),buyer:user.id};sheet('');view='chat';render()}
 else if(a==='chat'){chat={pid:t.dataset.p,buyer:t.dataset.b};view='chat';render()}
 else if(a==='send'){const el=$('#ct'),tx=el.value.trim();if(!tx)return;el.value='';
  try{await rpc('envoyer_message',{p_product:+chat.pid,p_buyer:chat.buyer,p_texte:tx});await loadM();const c=$('#cl');c.innerHTML=chatHtml();c.scrollTop=c.scrollHeight}catch(x){el.value=tx;throw x}}
 else if(a==='adm'){sheet('');adm=null;view='admin';render()}
 else if(a==='adc'){if(!confirm('Confirmer cette décision ?'))return;await rpc('admin_resoudre',{p_claim:+id,p_decision:t.dataset.x});adm=null;await reload()}
 else if(a==='apr'){if(!confirm('Confirmer cette action sur l\'annonce ?'))return;await rpc('admin_produit',{p_product:+id,p_action:t.dataset.x});adm=null;await reload()}
 else if(a==='asp'){await rpc('admin_suspendre',{p_user:id,p_etat:t.dataset.x==='1'});adm=null;await reload()}
 else if(a==='buy'){if(need())buyForm(id)}
 else if(a==='ok'){const p=P(id),n=Math.floor(+$('#bq').value),nm=$('#bn').value.trim(),tel=$('#bt').value.trim(),mode=$('#bm').value,ad=$('#ba').value.trim();
  if(!(n>=1&&n<=p.quantite))return er('#bmsg','Quantité invalide (maximum : '+p.quantite+').');
  if(!nm)return er('#bmsg','Entrez votre nom.');if(tel.replace(/\D/g,'').length<8)return er('#bmsg','Entrez un numéro de téléphone valide.');
  if(mode==='Livraison'&&!ad)return er('#bmsg','Entrez l\'adresse de livraison.');
  t.disabled=true;
  try{await rpc('passer_commande',{p_product:p.id,p_qte:n,p_client:nm,p_tel:tel,p_mode:mode,p_adresse:mode==='Livraison'?ad:''})}catch(x){t.disabled=false;return er('#bmsg',x.message)}
  sheet('');view='orders';await reload();toast('Commande enregistrée : paiement en attente.')}
 else if(a==='cancel'){if(confirm('Annuler cette commande ?')){await rpc('annuler_commande',{p_order:+id});await reload()}}
 else if(a==='claim'){const m=(prompt('Décrivez le problème (produit différent, retard, produit non reçu...) :')||'').trim();
  if(!m)return;if(m.length<5)return toast('Décrivez le problème en quelques mots.');
  await rpc('signaler_probleme',{p_order:+id,p_motif:m.slice(0,300)});await reload()}
 else if(a==='tab'){tab=t.dataset.t;shop()}
 else if(a==='tog'){const p=P(id),{error}=await sb.from('products').update({disponible:p.disponible===false}).eq('id',p.id);if(error)throw error;await reload()}
 else if(a==='del'){if(recues.some(c=>c.product_id==id&&!['Annulée','Refusée','Livrée'].includes(c.statut)))return toast('Des commandes sont en cours : marquez plutôt l\'annonce indisponible.');
  if(confirm('Supprimer cette annonce ?')){const {error}=await sb.from('products').delete().eq('id',+id);if(error)throw error;sheet('');await reload()}}
 else if(a==='st'){const s=t.dataset.s;if(s==='Refusée'&&!confirm('Refuser cette commande ?'))return;await rpc('changer_statut',{p_order:+id,p_statut:s});await reload()}
 else if(a==='conf'){const v=($('#cc'+id).value||'').trim();if(!/^\d{5}$/.test(v))return toast('Entrez les 5 chiffres du code.');
  const r=await rpc('confirmer_livraison',{p_order:+id,p_code:v});
  if(r==='ok')toast('Livraison confirmée !');else if(r==='bloque')toast('Trop de tentatives : commande bloquée.');else toast('Code incorrect.');
  await reload()}
 else if(a==='add'){const p=P(id),i=cart.find(x=>x.id==id),n=(i?i.q:0)+1;if(n>p.quantite)return toast('Stock maximum atteint.');i?i.q=n:cart.push({id:p.id,q:1});saveCart();toast('Ajouté au panier')}
 else if(a==='cq'){const i=cart.find(x=>x.id==id),p=P(id),n=i.q+ +t.dataset.d;if(n>p.quantite)return toast('Stock maximum atteint.');if(n<1)cart=cart.filter(x=>x!==i);else i.q=n;saveCart();cartView()}
 else if(a==='crm'){cart=cart.filter(x=>x.id!=id);saveCart();cartView()}
 else if(a==='cgo'){if(cartItems().length&&need())cartForm()}
 else if(a==='cok'){const l=cartItems(),nm=$('#bn').value.trim(),tel=$('#bt').value.trim(),mode=$('#bm').value,ad=$('#ba').value.trim();
  if(!l.length)return er('#bmsg','Votre panier est vide.');if(!nm)return er('#bmsg','Entrez votre nom.');if(tel.replace(/\D/g,'').length<8)return er('#bmsg','Entrez un numéro de téléphone valide.');
  if(mode==='Livraison'&&!ad)return er('#bmsg','Entrez l\'adresse de livraison.');
  t.disabled=true;
  try{for(const x of l)await rpc('passer_commande',{p_product:x.p.id,p_qte:x.q,p_client:nm,p_tel:tel,p_mode:mode,p_adresse:mode==='Livraison'?ad:''})}catch(x){t.disabled=false;await reload();return er('#bmsg',x.message)}
  cart=[];saveCart();sheet('');view='orders';await reload();toast('Commandes enregistrées : paiement en attente.')}
 else if(a==='edit'){editId=+id;keepPh=[...(P(id).photos||[])];photos=[];sheet('');view='sell';render()}
 else if(a==='canedit'){editId=null;keepPh=[];photos=[];view='shop';render()}
 else if(a==='rmold'){keepPh.splice(+t.dataset.i,1);pv()}
 else if(a==='jus'){const m=(prompt('Expliquez pourquoi la livraison est retardée (10 caractères minimum). Le délai sera prolongé de 3 jours, une seule fois :')||'').trim();
  if(!m)return;if(m.length<10)return toast('Expliquez le retard en quelques mots (10 caractères minimum).');
  await rpc('justifier_retard',{p_order:+id,p_motif:m.slice(0,300)});await reload();toast('Justification envoyée, délai prolongé.')}
 else if(a==='coord'){sheet(`<div class="f"><h2>Mes coordonnées</h2><p class="note">Visibles seulement par les acheteurs connectés, quand ils touchent « Contacter sur WhatsApp » ou « Appeler le vendeur ».</p>
  <label>Numéro WhatsApp (format international)</label><input id="cw" type="tel" inputmode="tel" placeholder="+22670123456" value="${esc(contact&&contact.whatsapp||'')}">
  <label>Numéro de téléphone pour les appels</label><input id="ctel" type="tel" inputmode="tel" placeholder="+22670123456" value="${esc(contact&&contact.telephone||'')}">
  <div id="cm"></div><button class="btn" data-a="coks">Enregistrer</button><div class="acts"><button class="btn alt" data-a="close">Fermer</button></div></div>`)}
 else if(a==='coks'){const nz=v=>{v=v.replace(/[\s.\-()]/g,'');if(v.startsWith('00'))v='+'+v.slice(2);return v},w=nz($('#cw').value.trim()),t2=nz($('#ctel').value.trim()),ok=v=>!v||/^\+[1-9]\d{7,14}$/.test(v);
  if(!ok(w)||!ok(t2))return er('#cm','Numéro invalide. Utilisez le format international, par exemple +22670123456.');
  const {error}=await sb.from('contacts_vendeur').upsert({user_id:user.id,whatsapp:w||null,telephone:t2||null,updated_at:new Date().toISOString()});if(error)throw error;
  contact={whatsapp:w||null,telephone:t2||null};sheet('');toast('Coordonnées enregistrées.')}
 else if(a==='wa'||a==='tel'){if(!need())return;const p=P(id);if(p.seller_id===user.id)return toast('C\'est votre propre annonce.');
  const c=await rpc('contact_vendeur',{p_product:p.id}),n=c&&(a==='wa'?c.whatsapp:c.telephone);
  if(!n)return toast(a==='wa'?'Le vendeur n\'a pas renseigné de numéro WhatsApp.':'Le vendeur n\'a pas renseigné de numéro de téléphone.');
  if(a==='wa')go('https://wa.me/'+n.replace(/\D/g,'')+'?text='+encodeURIComponent('Bonjour, je vous contacte depuis E-Market au sujet de votre annonce '+p.nom+'. Le produit est-il toujours disponible ?'),true);else go('tel:'+n,false)}
 else if(a==='sp'){if(!need())return;const p=P(id);sheet(`<div class="f"><h2>⭐ Sponsoriser mon annonce</h2><p>${esc(p.nom)}</p><p class="note">Choisissez la durée :</p><div class="acts" style="flex-direction:column">${SP.map(([k,l,pr])=>`<button class="btn alt" data-a="spf" data-id="${p.id}" data-f="${k}">${l} · ${fcfa(pr)}</button>`).join('')}</div><div class="acts"><button class="btn alt" data-a="close">Fermer</button></div></div>`)}
 else if(a==='spf'){const p=P(id),f=SP.find(y=>y[0]===t.dataset.f);sheet(`<div class="f"><h2>Récapitulatif</h2><div class="row"><span class="sub">Produit</span><span>${esc(p.nom)}</span></div><div class="row"><span class="sub">Durée</span><span>${f[1]}</span></div><div class="row"><span class="sub">Prix</span><b>${fcfa(f[2])}</b></div>
  <div class="warn">La sponsorisation donne plus de visibilité à votre annonce (étiquette « Sponsorisé » et section dédiée), sans garantir la première place. Elle s'active uniquement après confirmation du paiement et se termine automatiquement à la fin de la durée.</div><div id="spm"></div>
  <button class="btn acc" data-a="spok" data-id="${p.id}" data-f="${f[0]}">Confirmer ma demande</button><div class="acts"><button class="btn alt" data-a="sp" data-id="${p.id}">Retour</button></div></div>`)}
 else if(a==='spok'){t.disabled=true;try{await rpc('demander_sponsorisation',{p_product:+id,p_formule:t.dataset.f})}catch(x){t.disabled=false;return er('#spm',x.message)}
  tab='spons';view='shop';await reload();sheet(`<div class="f"><h2>Demande enregistrée</h2><p>Statut : <b>Paiement en attente</b></p><p class="note">Le paiement en ligne n'est pas encore disponible. Votre annonce sera sponsorisée dès que E-Market aura confirmé votre paiement. Suivez l'état dans Ma boutique → Sponsorisations.</p><div class="acts"><button class="btn" data-a="close">OK</button></div></div>`)}
 else if(a==='spx'){if(confirm('Annuler cette demande de sponsorisation ?')){await rpc('annuler_sponsorisation',{p_id:+id});await reload()}}
 else if(a==='saa'){const r=(prompt('Référence du paiement reçu (par exemple le numéro de transaction Orange ou Moov) :')||'').trim();if(!r)return;await rpc('admin_activer_sponsorisation',{p_id:+id,p_ref:r});adm=null;await reload();toast('Sponsorisation activée.')}
 else if(a==='pbn')adForm('');
 else if(a==='pbe')adForm(id);
 else if(a==='pbt'){const x=pubs.find(y=>y.id==id),{error}=await sb.from('publicites').update({actif:!x.actif}).eq('id',+id);if(error)throw error;adm=null;await reload()}
 else if(a==='pbd'){if(confirm('Supprimer définitivement cette publicité ?')){const {error}=await sb.from('publicites').delete().eq('id',+id);if(error)throw error;adm=null;await reload()}}
 else if(a==='pbs'){const g=i=>$(i).value.trim(),en=g('#pe'),ti=g('#pt'),li=g('#pl'),db=g('#pdb'),dfn=g('#pdf');
  if(!en||!ti)return er('#pm','Renseignez le nom de l\'entreprise et le titre.');
  if(li&&!/^https:\/\//.test(li))return er('#pm','Le lien doit commencer par https://');
  if(!db||!dfn)return er('#pm','Choisissez les dates de début et de fin.');
  const d1=new Date(db+'T00:00:00'),d2=new Date(dfn+'T23:59:59');if(!(d2>d1))return er('#pm','La date de fin doit être après la date de début.');
  t.disabled=true;
  try{let url=null;const fl=$('#pi').files[0];
   if(fl){const b=await shrink(fl),path=`${user.id}/pub_${Date.now()}.jpg`,up=await sb.storage.from('photos').upload(path,b,{contentType:'image/jpeg'});if(up.error)throw up.error;url=sb.storage.from('photos').getPublicUrl(path).data.publicUrl}
   const row={entreprise:en,titre:ti,description:g('#pd')||null,lien:li||null,debut:d1.toISOString(),fin:d2.toISOString(),actif:$('#pa').checked,emplacement:$('#pp').value};if(url)row.image_url=url;
   const rr=id?await sb.from('publicites').update(row).eq('id',+id):await sb.from('publicites').insert(row);if(rr.error)throw rr.error
  }catch(x){t.disabled=false;return er('#pm',x.message)}
  sheet('');adm=null;await reload();toast('Publicité enregistrée.')}
 else if(a==='rmph'){URL.revokeObjectURL(photos[+t.dataset.i].u);photos.splice(+t.dataset.i,1);pv()}
 else if(a==='pub'){if(me&&me.suspendu)return toast('Votre compte est suspendu.');const g=i=>$(i).value.trim(),pr=parseInt(g('#fx')),il=$('#fi').checked,qt=il?ILL:parseInt(g('#fq')),c=g('#fc');
  if(!g('#fn')||!(pr>0)||!(qt>0)||!g('#fd')){er('#fm','Renseignez le nom, un prix, une quantité et une description.');return}
  const lab=editId?'Enregistrer les modifications':'Publier mon annonce';
  t.disabled=true;t.textContent='Enregistrement…';
  try{const urls=[...keepPh];
   for(let i=0;i<photos.length;i++){const path=`${user.id}/${Date.now()}_${i}.jpg`;
    const {error}=await sb.storage.from('photos').upload(path,photos[i].b,{contentType:'image/jpeg'});if(error)throw error;
    urls.push(sb.storage.from('photos').getPublicUrl(path).data.publicUrl)}
   const row={nom:g('#fn'),prix:pr,categorie:c,etat:g('#fe'),quantite:qt,zone:g('#fz'),description:g('#fd'),photos:urls};
   if(editId){const {error}=await sb.from('products').update(row).eq('id',editId).eq('seller_id',user.id);if(error)throw error}
   else{const {error}=await sb.from('products').insert({seller_id:user.id,...row});if(error)throw error}
  }catch(x){t.disabled=false;t.textContent=lab;return er('#fm',x.message)}
  const was=editId;photos=[];keepPh=[];editId=null;q='';cat='';$('#q').value='';view=was?'shop':'home';await reload();toast(was?'Annonce modifiée !':'Votre annonce est publiée !')}
 }catch(x){toast(x.message||'Une erreur est survenue.')}
});
document.addEventListener('input',e=>{const i=e.target.id;
 if(i==='q'){q=e.target.value;if(view!=='home'){view='home';render()}else upd()}
 else if(i==='pmin'||i==='pmax'||i==='sort'){pmin=$('#pmin').value;pmax=$('#pmax').value;sort=$('#sort').value;upd()}});
document.addEventListener('change',e=>{if(e.target.id==='fp')addPhotos(e.target);if(e.target.id==='fi'){$('#fq').disabled=e.target.checked}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='ct'){const b=document.querySelector('[data-a="send"]');if(b)b.click()}});

/* ---------- Démarrage ---------- */
(async()=>{
 const {data}=await sb.auth.getSession();user=data.session?data.session.user:null;
 sb.auth.onAuthStateChange((_e,s)=>{user=s?s.user:null;setTimeout(reload,0)});
 try{await sb.rpc('expirer_commandes')}catch(e){}
 try{await sb.rpc('expirer_livraisons')}catch(e){}
 try{await sb.rpc('expirer_sponsorisations')}catch(e){}
 await reload();
})();
</script>
