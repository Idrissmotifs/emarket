<title>ZooDo | Acheter et vendre</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#F1F4EE;--surf:#fff;--ink:#14231C;--mute:#5B6B62;--line:#D8DFD4;--pri:#0E6B4F;--pri2:#12875F;--glow:rgba(14,107,79,.45);--onpri:#fff;--hdr:#0E6B4F;--acc:#F2A900;--soft:#E3EEE8;--err:#B3261E;--errbg:#f6dcd9;--wait:#FFF1C7;--waitink:#6b4e00}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1713;--surf:#17231D;--ink:#EAF1EC;--mute:#9DB0A5;--line:#2B3B33;--pri:#3DB88C;--pri2:#5FD0A6;--glow:rgba(61,184,140,.35);--onpri:#08140F;--hdr:#12382B;--soft:#1E3128;--err:#F2B8B5;--errbg:#3a1f1d;--wait:#3b3010;--waitink:#f2d88a}}
:root[data-theme="dark"]{--bg:#0F1713;--surf:#17231D;--ink:#EAF1EC;--mute:#9DB0A5;--line:#2B3B33;--pri:#3DB88C;--pri2:#5FD0A6;--glow:rgba(61,184,140,.35);--onpri:#08140F;--hdr:#12382B;--soft:#1E3128;--err:#F2B8B5;--errbg:#3a1f1d;--wait:#3b3010;--waitink:#f2d88a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.45 'Instrument Sans',system-ui,sans-serif;padding-bottom:104px}
h1,h2,h3{font-family:'Bricolage Grotesque','Instrument Sans',system-ui,sans-serif;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
header{position:sticky;top:0;z-index:5;background:var(--hdr);color:#fff;padding:calc(10px + env(safe-area-inset-top,0px)) 14px 12px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.logo{display:flex;align-items:center;min-width:0;font:800 24px 'Bricolage Grotesque',system-ui,sans-serif;letter-spacing:-.5px}
.logo img{display:block;width:230px;max-width:52vw;height:64px;object-fit:contain;background:transparent;border-radius:0;padding:0}
.tb{display:flex;gap:6px;align-items:center}[hidden]{display:none!important}
#nb{background:var(--acc);color:#14231C;border-radius:10px;padding:0 6px;font-size:12px;margin-left:3px}
.unr{border-inline-start:4px solid var(--acc)}
.box button.nbtn{all:unset;display:block;width:100%;cursor:pointer}
.le{display:inline-grid;place-items:center;width:34px;height:34px;background:var(--acc);color:#0E6B4F;border-radius:10px;font:italic 700 24px Georgia,serif;transform:rotate(-6deg);margin-right:3px;vertical-align:middle}
#cn{background:var(--acc);color:#14231C;border-radius:10px;padding:0 6px;font-size:12px}
.box.ci{display:flex;gap:10px}.ci .pic{width:72px;height:72px;aspect-ratio:auto;border-radius:10px;flex:none;font-size:30px}
.qty{display:flex;align-items:center;gap:8px;margin-top:6px}.qty>button:not(.btn){width:34px;height:34px;border-radius:50%;border:1.5px solid var(--line);background:var(--surf);font-size:18px;padding:0}
.ib{background:rgba(255,255,255,.16);color:#fff;border:1px solid rgba(255,255,255,.18);border-radius:999px;padding:7px 12px;backdrop-filter:blur(6px);transition:background .15s,transform .1s}.ib:hover{background:rgba(255,255,255,.26)}.ib:active{transform:scale(.94)}
.sb{display:flex;border-radius:999px;overflow:hidden;background:#fff;box-shadow:0 4px 14px -4px rgba(0,0,0,.35);padding:3px}
.sb input{flex:1;min-width:0;border:0;padding:10px 16px;background:#fff;color:#14231C;border-radius:999px}.sb input:focus{outline:none}

.ib svg{width:22px;height:22px;fill:none;stroke:#fff;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

.btn{background:var(--pri);border-radius:14px;padding:13px 20px;letter-spacing:0;box-shadow:0 1px 2px rgba(0,0,0,.12),0 8px 16px -10px var(--glow)}
.btn:hover{filter:none;background:var(--pri2)}
.btn.sm{border-radius:12px}
nav{left:0;right:0;bottom:0;max-width:none;margin:0;border:0;border-top:1px solid var(--line);border-radius:0;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));box-shadow:0 -8px 24px -12px rgba(0,0,0,.28)}

nav button b{display:grid;place-items:center;width:56px;height:30px;border-radius:15px;transition:background .2s,transform .2s}
nav button svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button.on{background:none;color:var(--pri);font-weight:700}
nav button.on b{background:var(--soft)}nav button.on svg{stroke-width:2.2}
nav button:active b{transform:scale(.92)}
.mn{display:grid;gap:8px;margin-top:12px}
.mn hr{border:0;border-top:1px solid var(--line);margin:4px 0;width:100%}
.mn button{all:unset;box-sizing:border-box;display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;padding:14px 16px;border-radius:14px;background:var(--surf);border:1px solid var(--line);font-weight:600;cursor:pointer;transition:border-color .15s,background .15s}

.mn button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.mn button.bad{color:var(--err)}.mn button.bad::after{content:""}

/* ===== Palette bleue + finitions premium ===== */
:root{--bg:#F3F6FC;--surf:#fff;--ink:#0F1B33;--mute:#5A6785;--line:#E1E8F5;--pri:#1D5FD8;--pri2:#3B82F6;--glow:rgba(29,95,216,.38);--onpri:#fff;--hdr:#123C94;--hdr2:#2F7BFF;--soft:#E7EFFD;--sh:rgba(29,95,216,.35)}

body{background:radial-gradient(900px 320px at 50% -80px,var(--soft),transparent 70%) no-repeat,var(--bg)}

.le{color:var(--hdr)}
.hero{position:relative;overflow:hidden;background:linear-gradient(135deg,var(--hdr),var(--hdr2) 65%,#7DB0FF);box-shadow:0 18px 36px -20px var(--hdr)}

.hero::before,.hero::after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.13);pointer-events:none}

.hero::after{width:110px;height:110px;right:70px;bottom:-60px;background:rgba(255,255,255,.09)}
.hero h2{font-size:24px;letter-spacing:-.3px}
.pills span{background:rgba(255,255,255,.18);backdrop-filter:blur(4px)}
.ct b{border:2px solid transparent;background:linear-gradient(var(--surf),var(--surf)) padding-box,linear-gradient(135deg,var(--pri),var(--acc)) border-box;box-shadow:0 8px 16px -10px var(--sh)}
.ct.on b{background:linear-gradient(var(--soft),var(--soft)) padding-box,linear-gradient(135deg,var(--pri),var(--acc)) border-box;box-shadow:0 0 0 4px var(--soft)}
.ct.on{color:var(--pri)}
.card{border:0;box-shadow:0 1px 2px rgba(15,27,51,.06),0 14px 26px -18px var(--sh);transition:transform .2s,box-shadow .2s}
.card:hover{transform:translateY(-3px);box-shadow:0 1px 2px rgba(15,27,51,.06),0 22px 34px -18px var(--sh)}
.in h3{font-weight:500}
.price{color:var(--pri);font-size:19px;letter-spacing:-.3px}
.sec h3{font-size:19px}
.box,.shp,.ad{border:0;box-shadow:0 1px 2px rgba(15,27,51,.06),0 12px 24px -18px var(--sh)}
.btn{background:linear-gradient(135deg,var(--pri2),var(--pri));box-shadow:0 10px 20px -10px var(--glow)}
.btn:hover{background:linear-gradient(135deg,var(--pri2),var(--pri2))}

nav{background:color-mix(in srgb,var(--surf) 88%,transparent);backdrop-filter:blur(14px)}

ce passe en tête de la liste « Plus récents » pendant 24 heures. Elle s'active après confirmation du paiement par ZooDo.":"您的信息将在 24 小时内置顶于“最新”列表。ZooDo 确认付款后生效。","Remontée en tête (24 heures)":"置顶（24 小时）","⬆️ En tête de liste":"⬆️ 列表置顶","Votre annonce est remontée en tête de liste.":"您的信息已置顶。","vues":"次浏览","contacts":"次联系","partages":"次分享","Les instructions de paiement seront communiquées par ZooDo.":"付款说明将由 ZooDo 提供。","⭐ Nouvel avis reçu":"⭐ 收到新评价","En créant un compte, vous acceptez les":"创建账户即表示您接受","conditions d'utilisation":"使用条款","et la":"和","politique de confidentialité":"隐私政策","Les textes écrits par les vendeurs sont traduits automatiquement : la qualité peut varier.":"卖家撰写的文字为自动翻译，质量可能有所差异。","Connectez-vous pour donner un avis.":"请登录后发表评价。","Note invalide.":"评分无效。","Vous pouvez donner un avis après avoir contacté ce vendeur par message.":"您联系该卖家（通过消息）后即可发表评价。","Cette annonce a déjà une demande en cours ou en attente.":"此信息已有进行中或待处理的申请。","Trop de demandes en attente. Annulez-en ou faites-les confirmer.":"待处理的申请过多。请取消部分申请或等待其确认。","Vous ne pouvez sponsoriser que vos propres annonces disponibles.":"您只能赞助自己的可售信息。","Conditions d'utilisation":"使用条款","1. Le service":"1. 服务","ZooDo est une plateforme de petites annonces. Elle met en relation des vendeurs et des acheteurs. ZooDo ne vend pas les produits, ne les détient pas et ne les livre pas : la vente se conclut directement entre l'acheteur et le vendeur, qui se mettent d'accord sur le prix, la livraison et le paiement.":"ZooDo 是一个分类信息平台，为卖家和买家牵线搭桥。ZooDo 不销售、不持有、也不配送商品：交易由买家和卖家直接达成，双方自行商定价格、配送和付款方式。","2. Votre compte":"2. 您的账户","Vous donnez des informations exactes et vous gardez votre mot de passe secret. Vous êtes responsable de ce qui est fait avec votre compte. Une personne = un compte.":"您需提供准确的信息并妥善保管密码。您须对账户下发生的一切行为负责。一人一个账户。","3. Vos annonces":"3. 您的信息","Décrivez honnêtement votre produit, avec des photos réelles et le vrai prix. Sont interdits : les produits illégaux, les armes, les drogues, les contrefaçons, les arnaques, les contenus choquants, les annonces en double ou sans rapport avec un produit ou un service. ZooDo peut désactiver ou supprimer une annonce et suspendre un compte qui ne respecte pas ces règles. Les avis laissés sur un vendeur doivent être honnêtes et respectueux : ZooDo peut supprimer un avis abusif.":"请如实描述商品，提供真实照片和真实价格。禁止发布：非法商品、武器、毒品、假冒商品、诈骗、令人反感的内容、重复信息，或与商品或服务无关的信息。对于不遵守这些规则的信息或账户，ZooDo 可停用或删除信息并暂停账户。对卖家的评价必须真实且有礼貌：ZooDo 可删除恶意评价。","4. Visibilité sur Facebook":"4. 在 Facebook 上的曝光","Pour faire connaître les annonces, ZooDo les republie automatiquement sur sa Page Facebook, avec le nom du produit, le prix, la zone, la description, les photos et un lien vers l'annonce. En publiant une annonce, vous acceptez cette republication.":"为了推广信息，ZooDo 会在其 Facebook 主页上自动转发这些信息，包括商品名称、价格、地区、描述、照片以及信息链接。发布信息即表示您接受此转发。","5. Sponsorisation":"5. 赞助","La mise en avant d'une annonce est payante. Les tarifs sont affichés dans l'application. La sponsorisation commence quand ZooDo a vérifié votre paiement et dure le temps de la formule choisie.":"信息推广需付费。价格显示在应用中。赞助在 ZooDo 核实您的付款后开始，持续时间为所选套餐的时长。","6. Conseils de sécurité":"6. 安全提示","Ne payez jamais avant d'avoir vu le produit. Rencontrez-vous dans un lieu public. Méfiez-vous des prix trop bas ou des demandes pressantes. Si une annonce vous semble suspecte, utilisez le bouton « Signaler cette annonce ».":"切勿在见到商品前付款。请在公共场所见面。警惕价格过低或催促的要求。如果您觉得某条信息可疑，请使用“举报此信息”按钮。","7. Responsabilité":"7. 责任","ZooDo ne peut pas vérifier chaque annonce ni chaque personne. Dans les limites permises par la loi, ZooDo n'est pas responsable des litiges, des pertes ou des dommages liés à une vente entre utilisateurs.":"ZooDo 无法核实每一条信息和每一个人。在法律允许的范围内，ZooDo 不对用户之间交易所产生的纠纷、损失或损害负责。","8. Changements":"8. 变更","Ces conditions peuvent évoluer. Si vous continuez à utiliser ZooDo après un changement, vous acceptez la nouvelle version.":"本条款可能会更新。如果您在更新后继续使用 ZooDo，即表示您接受新版本。","9. Contact":"9. 联系我们","Pour toute question, tout problème ou toute demande, écrivez à emarket.contact.drs@gmail.com.":"如有任何问题、困难或需求，请发送邮件至 emarket.contact.drs@gmail.com。","Politique de confidentialité":"隐私政策","1. Ce que nous collectons":"1. 我们收集的内容","Votre adresse e-mail, votre nom, le nom de votre boutique, vos numéros WhatsApp et téléphone si vous les ajoutez, vos annonces et leurs photos, vos messages, vos notifications, vos favoris et les avis que vous laissez.":"您的 e-mail 地址、姓名、店铺名称、您添加的 WhatsApp 和电话号码、您的信息及其照片、您的消息、通知、收藏以及您发表的评价。","2. Pourquoi":"2. 目的","Pour faire fonctionner votre compte, afficher vos annonces, permettre aux acheteurs de vous contacter, modérer les annonces signalées et gérer les sponsorisations.":"用于维持您的账户运行、展示您的信息、让买家能够联系您、审核被举报的信息以及管理赞助。","3. Ce qui est public":"3. 公开的内容","Le nom du produit, le prix, la description, les photos, la zone et le nom du vendeur ou de sa boutique sont visibles par tous, et republiés sur la Page Facebook ZooDo. Vos numéros ne sont jamais affichés publiquement : un acheteur connecté ne les obtient que lorsqu'il touche « Contacter sur WhatsApp » ou « Appeler le vendeur ». Les avis que vous laissez (note, commentaire et votre nom) sont publics. Le nombre de vues, de contacts et de partages d'une annonce n'est visible que par son vendeur.":"商品名称、价格、描述、照片、地区以及卖家或其店铺的名称对所有人可见，并会转发到 ZooDo 的 Facebook 主页。您的号码绝不会公开显示：已登录的买家只有在点击“通过 WhatsApp 联系”或“致电卖家”时才能获得。您发表的评价（评分、评论和您的姓名）是公开的。信息的浏览次数、联系次数和分享次数仅卖家本人可见。","4. Partage":"4. 共享","Nous ne vendons pas vos données. Les annonces publiées sont republiées sur la page Facebook de ZooDo. Pour afficher le site dans la langue choisie, le texte des annonces peut être envoyé à un service de traduction automatique.":"我们不会出售您的数据。已发布的信息会转发到 ZooDo 的 Facebook 主页。为了以所选语言显示网站，信息文本可能会被发送至自动翻译服务。","5. Stockage sur votre appareil":"5. 在您设备上的存储","Le site enregistre sur votre appareil vos choix de langue, de devise et de thème, ainsi que votre panier. Il n'y a pas de suivi publicitaire.":"网站会在您的设备上保存您选择的语言、货币和主题，以及您的购物车。我们不进行广告跟踪。","6. Vos droits":"6. 您的权利","Vous pouvez modifier ou supprimer vos annonces à tout moment. Pour consulter, corriger ou supprimer vos données ou votre compte, écrivez à emarket.contact.drs@gmail.com.":"您可以随时修改或删除您的信息。如需查看、更正或删除您的数据或账户，请发送邮件至 emarket.contact.drs@gmail.com。","7. Conservation":"7. 保存期限","Vos données sont gardées tant que votre compte existe, ou le temps nécessaire pour traiter un signalement ou un litige.":"只要您的账户存在，或在处理举报或纠纷所需的时间内，您的数据都会被保留。","23 octobre 2026":"2026 年 10 月 23 日","Télécom":"通信","Chaussures et sacs":"鞋包","Produits de beauté":"美妆产品","Cosmétiques":"化妆品","Électroménager":"家用电器","Maison et meubles":"家居和家具","Quincaillerie":"五金","Ferraille":"废金属","Pièces détachées":"零配件","Véhicules et motos":"车辆和摩托车","Matériaux de construction":"建筑材料","Alimentation":"食品","Bébé et enfants":"母婴童","Immobilier":"房产","Services":"服务","Vendeur vérifié":"已认证卖家","Adresse":"地址","Site web":"网站","des clients recommandent ce vendeur":"的客户推荐此卖家","✏️ Modifier ma boutique":"✏️ 修改我的店铺","♡ Ajouter la boutique aux favoris":"♡ 收藏店铺","♥ Boutique favorite":"♥ 已收藏店铺","Boutiques favorites":"收藏的店铺","📞 Appeler":"📞 致电","Modifier ma boutique":"修改我的店铺","Photo de profil":"头像","Photo de couverture":"封面图","Nom de la boutique":"店铺名称","Présentation (facultatif)":"简介（选填）","Adresse (facultatif)":"地址（选填）","Site web (https://…, facultatif)":"网站 (https://…，选填)","E-mail public (facultatif)":"公开 e-mail（选填）","Vos numéros WhatsApp et téléphone se règlent dans 👤 → Mes coordonnées. Ils restent visibles seulement par les utilisateurs connectés.":"您的 WhatsApp 和电话号码请在 👤 → 我的联系方式 中设置。它们仅对已登录用户可见。","Enregistrer ma boutique":"保存我的店铺","Boutique enregistrée !":"店铺已保存！","Photo de profil invalide.":"头像无效。","Photo de couverture invalide.":"封面图无效。","Le lien du site doit commencer par https://":"网站链接必须以 https:// 开头","Adresse e-mail invalide.":"e-mail 地址无效。","Cette adresse e-mail est déjà utilisée. Connectez-vous.":"此 e-mail 地址已被使用。请登录。","Inscription momentanément indisponible. Réessayez plus tard.":"暂时无法注册。请稍后再试。","Un code à usage unique a été envoyé à":" re seront visibles par tous.":"Ihre Bewertung und Ihr Kommentar sind für alle sichtbar.","Choisissez une note de 1 à 5.":"Wählen Sie eine Bewertung von 1 bis 5.","Merci pour votre avis !":"Danke für Ihre Bewertung!","Vous ne pouvez pas vous noter vous-même.":"Sie können sich nicht selbst bewerten.","Écrivez d'abord au vendeur (bouton « Écrire au vendeur ») pour pouvoir donner un avis.":"Schreiben Sie zuerst dem Verkäufer (Schaltfläche „Verkäufer schreiben“), um eine Bewertung abgeben zu können.","Supprimer cet avis ?":"Diese Bewertung löschen?","Aucune annonce disponible.":"Keine Anzeigen verfügbar.","🏪 Voir ma page boutique":"🏪 Meine Shop-Seite ansehen","Aucun favori pour le moment.":"Noch keine Favoriten.","Touchez le cœur sur une annonce pour la retrouver ici.":"Tippen Sie bei einer Anzeige auf das Herz, um sie hier wiederzufinden.","⬆️ Remonter":"⬆️ Hochschieben","⬆️ Remonter à nouveau":"⬆️ Erneut hochschieben","⬆️ Remonter mon annonce":"⬆️ Meine Anzeige hochschieben","Votre annonce passe en tête de la liste « Plus récents » pendant 24 heures. Elle s'active après confirmation du paiement par ZooDo.":"Ihre Anzeige steht 24 Stunden lang ganz oben in der Liste „Neueste zuerst“. Sie wird aktiviert, nachdem ZooDo die Zahlung bestätigt hat.","Remontée en tête (24 heures)":"Nach oben schieben (24 Stunden)","⬆️ En tête de liste":"⬆️ Oben in der Liste","Votre annonce est remontée en tête de liste.":"Ihre Anzeige wurde an die Spitze der Liste geschoben.","vues":"Aufrufe","contacts":"Kontakte","partages":"Teilungen","Les instructions de paiement seront communiquées par ZooDo.":"Die Zahlungsanweisungen werden von ZooDo mitgeteilt.","⭐ Nouvel avis reçu":"⭐ Neue Bewertung erhalten","En créant un compte, vous acceptez les":"Mit der Erstellung eines Kontos akzeptieren Sie die","conditions d'utilisation":"Nutzungsbedingungen","et la":"und die","politique de confidentialité":"Datenschutzerklärung","Les textes écrits par les vendeurs sont traduits automatiquement : la qualité peut varier.":"Von Verkäufern verfasste Texte werden automatisch übersetzt: Die Qualität kann variieren.","Connectez-vous pour donner un avis.":"Melden Sie sich an, um eine Bewertung abzugeben.","Note invalide.":"Ungültige Bewertung.","Vous pouvez donner un avis après avoir contacté ce vendeur par message.":"Sie können eine Bewertung abgeben, nachdem Sie diesen Verkäufer per Nachricht kontaktiert haben.","Cette annonce a déjà une demande en cours ou en attente.":"Für diese Anzeige gibt es bereits eine laufende oder ausstehende Anfrage.","Trop de demandes en attente. Annulez-en ou faites-les confirmer.":"Zu viele ausstehende Anfragen. Stornieren Sie einige oder lassen Sie sie bestätigen.","Vous ne pouvez sponsoriser que vos propres annonces disponibles.":"Sie können nur Ihre eigenen verfügbaren Anzeigen sponsern.","Conditions d'utilisation":"Nutzungsbedingungen","1. Le service":"1. Der Dienst","ZooDo est une plateforme de petites annonces. Elle met en relation des vendeurs et des acheteurs. ZooDo ne vend pas les produits, ne les détient pas et ne les livre pas : la vente se conclut directement entre l'acheteur et le vendeur, qui se mettent d'accord sur le prix, la livraison et le paiement.":"ZooDo ist eine Kleinanzeigen-Plattform. Sie bringt Verkäufer und Käufer zusammen. ZooDo verkauft die Produkte nicht, besitzt sie nicht und liefert sie nicht aus: Der Verkauf kommt direkt zwischen Käufer und Verkäufer zustande, die sich auf Preis, Lieferung und Zahlung einigen.","2. Votre compte":"2. Ihr Konto","Vous donnez des informations exactes et vous gardez votre mot de passe secret. Vous êtes responsable de ce qui est fait avec votre compte. Une personne = un compte.":"Sie machen genaue Angaben und halten Ihr Passwort geheim. Sie sind für alles verantwortlich, was mit Ihrem Konto geschieht. Eine Person = ein Konto.","3. Vos annonces":"3. Ihre Anzeigen","Décrivez honnêtement votre produit, avec des photos réelles et le vrai prix. Sont interdits : les produits illégaux, les armes, les drogues, les contrefaçons, les arnaques, les contenus choquants, les annonces en double ou sans rapport avec un produit ou un service. ZooDo peut désactiver ou supprimer une annonce et suspendre un compte qui ne respecte pas ces règles. Les avis laissés sur un vendeur doivent être honnêtes et respectueux : ZooDo peut supprimer un avis abusif.":"Beschreiben Sie Ihr Produkt ehrlich, mit echten Fotos und dem wahren Preis. Verboten sind: illegale Produkte, Waffen, Drogen, Fälschungen, Betrug, anstößige Inhalte sowie doppelte Anzeigen oder Anzeigen ohne Bezug zu einem Produkt oder einer Dienstleistung. ZooDo kann eine Anzeige deaktivieren oder löschen und ein Konto sperren, das diese Regeln nicht einhält. Bewertungen über einen Verkäufer müssen ehrlich und respektvoll sein: ZooDo kann eine missbräuchliche Bewertung löschen.","4. Visibilité sur Facebook":"4. Sichtbarkeit auf Facebook","Pour faire connaître les annonces, ZooDo les republie automatiquement sur sa Page Facebook, avec le nom du produit, le prix, la zone, la description, les photos et un lien vers l'annonce. En publiant une annonce, vous acceptez cette republication.":"Um Anzeigen bekannt zu machen, veröffentlicht ZooDo sie automatisch erneut auf seiner Facebook-Seite, mit Produktname, Preis, Gebiet, Beschreibung, Fotos und einem Link zur Anzeige. Mit der Veröffentlichung einer Anzeige stimmen Sie dieser erneuten Veröffentlichung zu.","5. Sponsorisation":"5. Sponsoring","La mise en avant d'une annonce est payante. Les tarifs sont affichés dans l'application. La sponsorisation commence quand ZooDo a vérifié votre paiement et dure le temps de la formule choisie.":"Die Hervorhebung einer Anzeige ist kostenpflichtig. Die Preise werden in der App angezeigt. Das Sponsoring beginnt, wenn ZooDo Ihre Zahlung geprüft hat, und dauert so lange wie das gewählte Paket.","6. Conseils de sécurité":"6. Sicherheitstipps","Ne payez jamais avant d'avoir vu le produit. Rencontrez-vous dans un lieu public. Méfiez-vous des prix trop bas ou des demandes pressantes. Si une annonce vous semble suspecte, utilisez le bouton « Signaler cette annonce ».":"Bezahlen Sie niemals, bevor Sie das Produkt gesehen haben. Treffen Sie sich an einem öffentlichen Ort. Seien Sie misstrauisch bei zu niedrigen Preisen oder drängenden Forderungen. Wenn Ihnen eine Anzeige verdächtig vorkommt, nutzen Sie die Schaltfläche „Diese Anzeige melden“.","7. Responsabilité":"7. Haftung","ZooDo ne peut pas vérifier chaque annonce ni chaque personne. Dans les limites permises par la loi, ZooDo n'est pas responsable des litiges, des pertes ou des dommages liés à une vente entre utilisateurs.":"ZooDo kann nicht jede Anzeige und jede Person überprüfen. Im gesetzlich zulässigen Rahmen haftet ZooDo nicht für Streitigkeiten, Verluste oder Schäden im Zusammenhang mit einem Verkauf zwischen Nutzern.","8. Changements":"8. Änderungen","Ces conditions peuvent évoluer. Si vous continuez à utiliser ZooDo après un changement, vous acceptez la nouvelle version.":"Diese Bedingungen können sich ändern. Wenn Sie ZooDo nach einer Änderung weiter nutzen, akzeptieren Sie die neue Fassung.","9. Contact":"9. Kontakt","Pour toute question, tout problème ou toute demande, écrivez à emarket.contact.drs@gmail.com.":"Bei Fragen, Problemen oder Anliegen schreiben Sie an emarket.contact.drs@gmail.com.","Politique de confidentialité":"Datenschutzerklärung","1. Ce que nous collectons":"1. Was wir erheben","Votre adresse e-mail, votre nom, le nom de votre boutique, vos numéros WhatsApp et téléphone si vous les ajoutez, vos annonces et leurs photos, vos messages, vos notifications, vos favoris et les avis que vous laissez.":"Ihre E-Mail-Adresse, Ihren Namen, den Namen Ihres Shops, Ihre WhatsApp- und Telefonnummern, falls Sie diese hinzufügen, Ihre Anzeigen und deren Fotos, Ihre Nachrichten, Ihre Benachrichtigungen, Ihre Favoriten und die Bewertungen, die Sie abgeben.","2. Pourquoi":"2. Wozu","Pour faire fonctionner votre compte, afficher vos annonces, permettre aux acheteurs de vous contacter, modérer les annonces signalées et gérer les sponsorisations.":"Um Ihr Konto zu betreiben, Ihre Anzeigen anzuzeigen, Käufern die Kontaktaufnahme zu ermöglichen, gemeldete Anzeigen zu moderieren und Sponsorings zu verwalten.","3. Ce qui est public":"3. Was öffentlich ist","Le nom du produit, le prix, la description, les photos, la zone et le nom du vendeur ou de sa boutique sont visibles par tous, et republiés sur la Page Facebook ZooDo. Vos numéros ne sont jamais affichés publiquement : un acheteur connecté ne les obtient que lorsqu'il touche « Contacter sur WhatsApp » ou « Appeler le vendeur ». Les avis que vous laissez (note, commentaire et votre nom) sont publics. Le nombre de vues, de contacts et de partages d'une annonce n'est visible que par son vendeur.":"Produktname, Preis, Beschreibung, Fotos, Gebiet und der Name des Verkäufers oder seines Shops sind für alle sichtbar und werden auf der ZooDo-Facebook-Seite erneut veröffentlicht. Ihre Nummern werden niemals öffentlich angezeigt: Ein angemeldeter Käufer erhält sie nur, wenn er auf „Über WhatsApp kontaktieren“ oder „Verkäufer anrufen“ tippt. Die Bewertungen, die Sie abgeben (Bewertung, Kommentar und Ihr Name), sind öffentlich. Die Anzahl der Aufrufe, Kontakte und Teilungen einer Anzeige ist nur für den jeweiligen Verkäufer sichtbar.","4. Partage":"4. Weitergabe","Nous ne vendons pas vos données. Les annonces publiées sont republiées sur la page Facebook de ZooDo. Pour afficher le site dans la langue choisie, le texte des annonces peut être envoyé à un service de traduction automatique.":"Wir verkaufen Ihre Daten nicht. Veröffentlichte Anzeigen werden auf der Facebook-Seite von ZooDo erneut veröffentlicht. Um die Website in der gewählten Sprache anzuzeigen, kann der Text von Anzeigen an einen automatischen Übersetzungsdienst gesendet werden.","5. Stockage sur votre appareil":"5. Speicherung auf Ihrem Gerät","Le site enregistre sur votre appareil vos choix de langue, de devise et de thème, ainsi que votre panier. Il n'y a pas de suivi publicitaire.":"Die Website speichert auf Ihrem Gerät Ihre Auswahl für Sprache, Währung und Design sowie Ihren Warenkorb. Es gibt kein Werbe-Tracking.","6. Vos droits":"6. Ihre Rechte","Vous pouvez modifier ou supprimer vos annonces à tout moment. Pour consulter, corriger ou supprimer vos données ou votre compte, écrivez à emarket.contact.drs@gmail.com.":"Sie können Ihre Anzeigen jederzeit bearbeiten oder löschen. Um Ihre Daten oder Ihr Konto einzusehen, zu berichtigen oder zu löschen, schreiben Sie an emarket.contact.drs@gmail.com.","7. Conservation":"7. Speicherdauer","Vos données sont gardées tant que votre compte existe, ou le temps nécessaire pour traiter un signalement ou un litige.":"Ihre Daten werden gespeichert, solange Ihr Konto besteht, oder so lange, wie es zur Bearbeitung einer Meldung oder eines Streitfalls nötig ist.","23 octobre 2026":"23. Oktober 2026","Télécom":"Telekom","Chaussures et sacs":"Schuhe und Taschen","Produits de beauté":"Schönheitsprodukte","Cosmétiques":"Kosmetik","Électroménager":"Haushaltsgeräte","Maison et meubles":"Haus und Möbel","Quincaillerie":"Eisenwaren","Ferraille":"Altmetall","Pièces détachées":"Ersatzteile","Véhicules et motos":"Fahrzeuge und Motorräder","Matériaux de construction":"Baumaterialien","Alimentation":"Lebensmittel","Bébé et enfants":"Baby und Kinder","Immobilier":"Immobilien","Services":"Dienstleistungen","Vendeur vérifié":"Verifizierter Verkäufer","Site web":"Website","des clients recommandent ce vendeur":"der Kunden empfehlen diesen Verkäufer","✏️ Modifier ma boutique":"✏️ Meinen Shop bearbeiten","♡ Ajouter la boutique aux favoris":"♡ Shop zu Favoriten hinzufügen","♥ Boutique favorite":"♥ Favoriten-Shop","Boutiques favorites":"Favoriten-Shops","📞 Appeler":"📞 Anrufen","Modifier ma boutique":"Meinen Shop bearbeiten","Photo de profil":"Profilfoto","Photo de couverture":"Titelbild","Nom de la boutique":"Shop-Name","Présentation (facultatif)":"Vorstel rmar mi solicitud","Payer ma sponsorisation":"Pagar mi patrocinio","Demande n°":"Solicitud n.º","Formule":"Plan","Montant à payer":"Importe a pagar","Comment payer":"Cómo pagar","Après votre paiement, saisissez ici la référence ou le code reçu par SMS après le paiement (celui donné par le service de paiement). ZooDo la vérifie, puis active votre sponsorisation. Une référence déclarée n'active rien toute seule.":"Tras realizar su pago, introduzca aquí la referencia o el código recibido por SMS después del pago (el que le da el servicio de pago). ZooDo lo verifica y luego activa su patrocinio. Una referencia declarada no activa nada por sí sola.","Référence du paiement":"Referencia del pago","J'ai envoyé le paiement":"He enviado el pago","Ex : numéro de transaction":"Ej.: número de transacción","Merci !":"¡Gracias!","Votre référence a été envoyée. ZooDo vérifie le paiement, puis votre annonce sera sponsorisée.":"Su referencia ha sido enviada. ZooDo verifica el pago y después su anuncio será patrocinado.","En attente de paiement":"Pago pendiente","Active":"Activo","Expirée":"Expirado","Annulée":"Cancelado","Paiement échoué":"Pago fallido","Payer / indiquer ma référence":"Pagar / indicar mi referencia","Modifier la référence":"Editar la referencia","Annuler la demande":"Cancelar la solicitud","Aucune sponsorisation pour le moment.":"Aún no hay patrocinios.","Depuis « Mes annonces », touchez « Sponsoriser ».":"Desde «Mis anuncios», toque «Patrocinar».","Votre annonce est maintenant sponsorisée.":"Su anuncio ya está patrocinado.","Votre sponsorisation a expiré.":"Su patrocinio ha expirado.","Mes coordonnées":"Mis datos de contacto","📞 Mes coordonnées":"📞 Mis datos de contacto","Visibles seulement par les acheteurs connectés, quand ils touchent « Contacter sur WhatsApp » ou « Appeler le vendeur ».":"Solo los ven los compradores con sesión iniciada, cuando tocan «Contactar por WhatsApp» o «Llamar al vendedor».","Numéro de téléphone (format international)":"Número de teléfon otre note et votre commentaire seront visibles par tous.":"Su valoración y su comentario serán visibles para todos.","Choisissez une note de 1 à 5.":"Elija una valoración de 1 a 5.","Merci pour votre avis !":"¡Gracias por su opinión!","Vous ne pouvez pas vous noter vous-même.":"No puede valorarse a sí mismo.","Écrivez d'abord au vendeur (bouton « Écrire au vendeur ») pour pouvoir donner un avis.":"Escriba primero al vendedor (botón «Escribir al vendedor») para poder dejar una opinión.","Supprimer cet avis ?":"¿Eliminar esta opinión?","Aucune annonce disponible.":"No hay anuncios disponibles.","🏪 Voir ma page boutique":"🏪 Ver la página de mi tienda","Aucun favori pour le moment.":"Aún no hay favoritos.","Touchez le cœur sur une annonce pour la retrouver ici.":"Toque el corazón en un anuncio para encontrarlo aquí.","⬆️ Remonter":"⬆️ Subir","⬆️ Remonter à nouveau":"⬆️ Subir de nuevo","⬆️ Remonter mon annonce":"⬆️ Subir mi anuncio","Votre annonce passe en tête de la liste « Plus récents » pendant 24 heures. Elle s'active après confirmation du paiement par ZooDo.":"Su anuncio pasa al principio de la lista «Más recientes» durante 24 horas. Se activa tras la confirmación del pago por parte de ZooDo.","Remontée en tête (24 heures)":"Subir al principio (24 horas)","⬆️ En tête de liste":"⬆️ Al principio de la lista","Votre annonce est remontée en tête de liste.":"Su anuncio ha subido al principio de la lista.","vues":"vistas","contacts":"contactos","partages":"veces compartido","Les instructions de paiement seront communiquées par ZooDo.":"ZooDo comunicará las instrucciones de pago.","⭐ Nouvel avis reçu":"⭐ Nueva opinión recibida","En créant un compte, vous acceptez les":"Al crear una cuenta, usted acepta las","conditions d'utilisation":"condiciones de uso","et la":"y la","politique de confidentialité":"política de privacidad","Les textes écrits par les vendeurs sont traduits automatiquement : la qualité peut varier.":"Los textos escritos por los vendedores se traducen automáticamente: la calidad puede variar.","Connectez-vous pour donner un avis.":"Inicie sesión para dejar una opinión.","Note invalide.":"Valoración no válida.","Vous pouvez donner un avis après avoir contacté ce vendeur par message.":"Puede dejar una opinión después de haber contactado a este vendedor por mensaje.","Cette annonce a déjà une demande en cours ou en attente.":"Este anuncio ya tiene una solicitud en curso o pendiente.","Trop de demandes en attente. Annulez-en ou faites-les confirmer.":"Demasiadas solicitudes pendientes. Cancele algunas o haga que se confirmen.","Vous ne pouvez sponsoriser que vos propres annonces disponibles.":"Solo puede patrocinar sus propios anuncios disponibles.","Conditions d'utilisation":"Condiciones de uso","1. Le service":"1. El servicio","ZooDo est une plateforme de petites annonces. Elle met en relation des vendeurs et des acheteurs. ZooDo ne vend pas les produits, ne les détient pas et ne les livre pas : la vente se conclut directement entre l'acheteur et le vendeur, qui se mettent d'accord sur le prix, la livraison et le paiement.":"ZooDo es una plataforma de anuncios clasificados. Pone en contacto a vendedores y compradores. ZooDo no vende los productos, no los tiene en su poder ni los entrega: la venta se concluye directamente entre el comprador y el vendedor, que acuerdan el precio, la entrega y el pago.","2. Votre compte":"2. Su cuenta","Vous donnez des informations exactes et vous gardez votre mot de passe secret. Vous êtes responsable de ce qui est fait avec votre compte. Une personne = un compte.":"Usted proporciona información exacta y mantiene su contraseña en secreto. Usted es responsable de lo que se haga con su cuenta. Una persona = una cuenta.","3. Vos annonces":"3. Sus anuncios","Décrivez honnêtement votre produit, avec des photos réelles et le vrai prix. Sont interdits : les produits illégaux, les armes, les drogues, les contrefaçons, les arnaques, les contenus choquants, les annonces en double ou sans rapport avec un produit ou un service. ZooDo peut désactiver ou supprimer une annonce et suspendre un compte qui ne respecte pas ces règles. Les avis laissés sur un vendeur doivent être honnêtes et respectueux : ZooDo peut supprimer un avis abusif.":"Describa su producto con honestidad, con fotos reales y el precio real. Están prohibidos: los productos ilegales, las armas, las drogas, las falsificaciones, las estafas, los contenidos ofensivos, los anuncios duplicados o que no tengan relación con un producto o servicio. ZooDo puede desactivar o eliminar un anuncio y suspender una cuenta que no respete estas reglas. Las opiniones dejadas sobre un vendedor deben ser honestas y respetuosas: ZooDo puede eliminar una opinión abusiva.","4. Visibilité sur Facebook":"4. Visibilidad en Facebook","Pour faire connaître les annonces, ZooDo les republie automatiquement sur sa Page Facebook, avec le nom du produit, le prix, la zone, la description, les photos et un lien vers l'annonce. En publiant une annonce, vous acceptez cette republication.":"Para dar a conocer los anuncios, ZooDo los vuelve a publicar automáticamente en su página de Facebook, con el nombre del producto, el precio, la zona, la descripción, las fotos y un enlace al anuncio. Al publicar un anuncio, usted acepta esta republicación.","5. Sponsorisation":"5. Patrocinio","La mise en avant d'une annonce est payante. Les tarifs sont affichés dans l'application. La sponsorisation commence quand ZooDo a vérifié votre paiement et dure le temps de la formule choisie.":"Destacar un anuncio es de pago. Las tarifas se muestran en la aplicación. El patrocinio comienza cuando ZooDo ha verificado su pago y dura el tiempo del plan elegido.","6. Conseils de sécurité":"6. Consejos de seguridad","Ne payez jamais avant d'avoir vu le produit. Rencontrez-vous dans un lieu public. Méfiez-vous des prix trop bas ou des demandes pressantes. Si une annonce vous semble suspecte, utilisez le bouton « Signaler cette annonce ».":"Nunca pague antes de haber visto el producto. Quede en un lugar público. Desconfíe de los precios demasiado bajos o de las peticiones apremiantes. Si un anuncio le parece sospechoso, use el botón «Denunciar este anuncio».","7. Responsabilité":"7. Responsabilidad","ZooDo ne peut pas vérifier chaque annonce ni chaque personne. Dans les limites permises par la loi, ZooDo n'est pas responsable des litiges, des pertes ou des dommages liés à une vente entre utilisateurs.":"ZooDo no puede verificar cada anuncio ni a cada persona. Dentro de los límites permitidos por la ley, ZooDo no es responsable de los litigios, pérdidas o daños relacionados con una venta entre usuarios.","8. Changements":"8. Cambios","Ces conditions peuvent évoluer. Si vous continuez à utiliser ZooDo après un changement, vous acceptez la nouvelle version.":"Estas condiciones pueden cambiar. Si sigue usando ZooDo después de un cambio, acepta la nueva versión.","9. Contact":"9. Contacto","Pour toute question, tout problème ou toute demande, écrivez à emarket.contact.drs@gmail.com.":"Para cualquier pregunta, problema o solicitud, escriba a emarket.contact.drs@gmail.com.","Politique de confidentialité":"Política de privacidad","1. Ce que nous collectons":"1. Lo que recopilamos","Votre adresse e-mail, votre nom, le nom de votre boutique, vos numéros WhatsApp et téléphone si vous les ajoutez, vos annonces et leurs photos, vos messages, vos notifications, vos favoris et les avis que vous laissez.":"Su dirección de correo electrónico, su nombre, el nombre de su tienda, sus números de WhatsApp y de teléfono si los añade, sus anuncios y sus fotos, sus mensajes, sus notificaciones, sus favoritos y las opiniones que deja.","2. Pourquoi":"2. Por qué","Pour faire fonctionner votre compte, afficher vos annonces, permettre aux acheteurs de vous contacter, modérer les annonces signalées et gérer les sponsorisations.":"Para hacer funcionar su cuenta, mostrar sus anuncios, permitir que los compradores le contacten, moderar los anuncios denunciados y gestionar los patrocinios.","3. Ce qui est public":"3. Lo que es público","Le nom du produit, le prix, la description, les photos, la zone et le nom du vendeur ou de sa boutique sont visibles par tous, et republiés sur la Page Facebook ZooDo. Vos numéros ne sont jamais affichés publiquement : un acheteur connecté ne les obtient que lorsqu'il touche « Contacter sur WhatsApp » ou « Appeler le vendeur ». Les avis que vous laissez (note, commentaire et votre nom) sont publics. Le nombre de vues, de contacts et de partages d'une annonce n'est visible que par son vendeur.":"El nombre del producto, el precio, la descripción, las fotos, la zona y el nombre del vendedor o de su tienda son visibles para todos, y se vuelven a publicar en la página de Facebook de ZooDo. Sus números nunca se muestran públicamente: un comprador con sesión iniciada solo los obtiene cuando toca «Contactar por WhatsApp» o «Llamar al vendedor». Las opiniones que deja (valoración, comentario y su nombre) son públicas. El número de vistas, de contactos y de veces que se comparte un anuncio solo lo ve su vendedor.","4. Partage":"4. Compartición","Nous ne vendons pas vos données. Les annonces publiées sont republiées sur la page Facebook de ZooDo. Pour afficher le site dans la langue choisie, le texte des annonces peut être envoyé à un service de traduction automatique.":"No vendemos sus datos. Los anuncios publicados se vuelven a publicar en la página de Facebook de ZooDo. Para mostrar el sitio en el idioma elegido, el texto de los anuncios puede enviarse a un servicio de traducción automática.","5. Stockage sur votre appareil":"5. Almacenamiento en su dispositivo","Le site enregistre sur votre appareil vos choix de langue, de devise et de thème, ainsi que votre panier. Il n'y a pas de suivi publicitaire.":"El sitio guarda en su dispositivo sus opciones de idioma, moneda y tema, así como su carrito. No hay seguimiento publicitario.","6. Vos droits":"6. Sus derechos","Vous pouvez modifier ou supprimer vos annonces à tout moment. Pour consulter, corriger ou supprimer vos données ou votre compte, écrivez à emarket.contact.drs@gmail.com.":"Puede modificar o eliminar sus anuncios en cualquier momento. Para consultar, corregir o eliminar sus datos o su cuenta, escriba a emarket.contact.drs@gmail.com.","7. Conservation":"7. Conservación","Vos données sont gardées tant que votre compte existe, ou le temps nécessaire pour traiter un signalement ou un litige.":"Sus datos se conservan mientras exista su cuenta, o el tiempo necesario para tramitar una denuncia o un litigio.","23 octobre 2026":"23 de octubre de 2026","Télécom":"Telecomunicaciones","Chaussures et sacs":"Calzado y bolsos","Produits de beauté":"Productos de belleza","Cosmétiques":"Cosméticos","Électroménager":"Electrodomésticos","Maison et meubles":"Hogar y muebles","Quincaillerie":"Ferretería","Ferraille":"Chatarra","Pièces détachées":"Repuestos","Véhicules et motos":"Vehículos y motos","Matériaux de construction":"Materiales de construcción","Alimentation":"Alimentación","Bébé et enfants":"Bebés y niños","Immobilier":"Inmobiliaria","Services":"Servicios","Vendeur vérifié":"Vendedor verificado","Adresse":"Dirección","Site web":"Sitio web","des clients recommandent ce vendeur":"de los clientes recomiendan a este vendedor","✏️ Modifier ma boutique":"✏️ Editar mi tienda","♡ Ajouter la boutique aux favoris":"♡ Añadir la tienda a favoritos","♥ Boutique favorite":"♥ Tienda favorita","Boutiques favorites":"Tiendas favoritas","📞 Appeler":"📞 Llamar","Modifier ma boutique":"Editar mi tienda","Photo de profil":"Foto de perfil","Photo de couverture":"Foto de portada","Nom de la boutique":"Nombre de la tienda","Présentation (facultatif)":"Presentación (opcional)","Adresse (facultatif)":"Dirección (opcional)","Site web (https://…, facultatif)":"Sitio web (https://…, opcional)","E-mail public (facultatif)":"Correo electrónico público (opcional)","Vos numéros WhatsApp et téléphone se règlent dans 👤 → Mes coordonnées. Ils r пные объявления.","Conditions d'utilisation":"Условия использования","1. Le service":"1. Сервис","ZooDo est une plateforme de petites annonces. Elle met en relation des vendeurs et des acheteurs. ZooDo ne vend pas les produits, ne les détient pas et ne les livre pas : la vente se conclut directement entre l'acheteur et le vendeur, qui se mettent d'accord sur le prix, la livraison et le paiement.":"ZooDo — платформа частных объявлений. Она связывает продавцов и покупателей. ZooDo не продаёт товары, не хранит их и не доставляет: сделка заключается напрямую между покупателем и продавцом, которые сами договариваются о цене, доставке и оплате.","2. Votre compte":"2. Ваш аккаунт","Vous donnez des informations exactes et vous gardez votre mot de passe secret. Vous êtes responsable de ce qui est fait avec votre compte. Une personne = un compte.":"Вы указываете достоверные данные и храните пароль в тайне. Вы несёте ответственность за все действия, совершённые с Вашего аккаунта. Один человек — один аккаунт.","3. Vos annonces":"3. Ваши объявления","Décrivez honnêtement votre produit, avec des photos réelles et le vrai prix. Sont interdits : les produits illégaux, les armes, les drogues, les contrefaçons, les arnaques, les contenus choquants, les annonces en double ou sans rapport avec un produit ou un service. ZooDo peut désactiver ou supprimer une annonce et suspendre un compte qui ne respecte pas ces règles. Les avis laissés sur un vendeur doivent être honnêtes et respectueux : ZooDo peut supprimer un avis abusif.":"Честно описывайте свой товар, используйте реальные фото и настоящую цену. Запрещены: незаконные товары, оружие, наркотики, подделки, мошенничество, оскорбительный контент, дублирующиеся объявления и объявления, не связанные с товаром или услугой. ZooDo может отключить или удалить объявление и заблокировать аккаунт, нарушающий эти правила. Отзывы о продавце должны быть честными и уважительными: ZooDo может удалить недопустимый отзыв.","4. Visibilité sur Facebook":"4. Видимость на Facebook","Pour faire connaître les annonces, ZooDo les republie automatiquement sur sa Page Facebook, avec le nom du produit, le prix, la zone, la description, les photos et un lien vers l'annonce. En publiant une annonce, vous acceptez cette republication.":"Чтобы рассказать об объявлениях, ZooDo автоматически републикует их на своей странице Facebook с названием товара, ценой, районом, описанием, фото и ссылкой на объявление. Публикуя объявление, Вы соглашаетесь на такую републикацию.","5. Sponsorisation":"5. Спонсорство","La mise en avant d'une annonce est payante. Les tarifs sont affichés dans l'application. La sponsorisation commence quand ZooDo a vérifié votre paiement et dure le temps de la formule choisie.":"Продвижение объявления платное. Тарифы указаны в приложении. Спонсорство начинается, когда ZooDo проверит Вашу оплату, и действует в течение срока выбранного тарифа.","6. Conseils de sécurité":"6. Советы по безопасности","Ne payez jamais avant d'avoir vu le produit. Rencontrez-vous dans un lieu public. Méfiez-vous des prix trop bas ou des demandes pressantes. Si une annonce vous semble suspecte, utilisez le bouton « Signaler cette annonce ».":"Никогда не платите, пока не увидели товар. Встречайтесь в общественном месте. Остерегайтесь слишком низких цен и настойчивых просьб. Если объявление кажется Вам подозрительным, нажмите кнопку «Пожаловаться на объявление».","7. Responsabilité":"7. Ответственность","ZooDo ne peut pas vérifier chaque annonce ni chaque personne. Dans les limites permises par la loi, ZooDo n'est pas responsable des litiges, des pertes ou des dommages liés à une vente entre utilisateurs.":"ZooDo не может проверять каждое объявление и каждого человека. В пределах, допускаемых законом, ZooDo не несёт ответственности за споры, потери или ущерб, связанные со сделкой между пользователями.","8. Changements":"8. Изменения","Ces conditions peuvent évoluer. Si vous continuez à utiliser ZooDo après un changement, vous acceptez la nouvelle version.":"Эти условия могут меняться. Если Вы продолжаете пользоваться ZooDo после изменения, Вы принимаете новую версию.","9. Contact":"9. Контакты","Pour toute question, tout problème ou toute demande, écrivez à emarket.contact.drs@gmail.com.":"По любым вопросам, проблемам или запросам пишите на emarket.contact.drs@gmail.com.","Politique de confidentialité":"Политика конфиденциальности","1. Ce que nous collectons":"1. Что мы собираем","Votre adresse e-mail, votre nom, le nom de votre boutique, vos numéros WhatsApp et téléphone si vous les ajoutez, vos annonces et leurs photos, vos messages, vos notifications, vos favoris et les avis que vous laissez.":"Ваш адрес e-mail, имя, название магазина, номера WhatsApp и телефона (если Вы их добавите), Ваши объявления и их фото, сообщения, уведомления, избранное и оставленные Вами отзывы.","2. Pourquoi":"2. Зачем","Pour faire fonctionner votre compte, afficher vos annonces, permettre aux acheteurs de vous contacter, modérer les annonces signalées et gérer les sponsorisations.":"Чтобы работал Ваш аккаунт, отображались Ваши объявления, покупатели могли с Вами связаться, чтобы модерировать объявления, на которые поступили жалобы, и управлять спонсорством.","3. Ce qui est public":"3. Что является общедоступным","Le nom du produit, le prix, la description, les photos, la zone et le nom du vendeur ou de sa boutique sont visibles par tous, et republiés sur la Page Facebook ZooDo. Vos numéros ne sont jamais affichés publiquement : un acheteur connecté ne les obtient que lorsqu'il touche « Contacter sur WhatsApp » ou « Appeler le vendeur ». Les avis que vous laissez (note, commentaire et votre nom) sont publics. Le nombre de vues, de contacts et de partages d'une annonce n'est visible que par son vendeur.":"Название товара, цена, описание, фото, район и имя продавца или название его магазина видны всем и републикуются на странице ZooDo в Facebook. Ваши номера никогда не показываются публично: авторизованный покупатель получает их, только когда нажимает «Связаться через WhatsApp» или «Позвонить продавцу». Оставленные Вами отзывы (оценка, комментарий и Ваше имя) общедоступны. Количество просмотров, контактов и репостов объявления видно только его продавцу.","4. Partage":"4. Передача данных","Nous ne vendons pas vos données. Les annonces publiées sont republiées sur la page Facebook de ZooDo. Pour afficher le site dans la langue choisie, le texte des annonces peut être envoyé à un service de traduction automatique.":"Мы не продаём Ваши данные. Опубликованные объявления републикуются на странице ZooDo в Facebook. Чтобы показывать сайт на выбранном языке, тексты объявлений могут передаваться сервису автоматического перевода.","5. Stockage sur votre appareil":"5. Хранение на Вашем устройстве","Le site enregistre sur votre appareil vos choix de langue, de devise et de thème, ainsi que votre panier. Il n'y a pas de suivi publicitaire.":"Сайт сохраняет на Вашем устройстве выбранные Вами язык, валюту и тему, а также Вашу корзину. Рекламного отслеживания нет.","6. Vos droits":"6. Ваши права","Vous pouvez modifier ou supprimer vos annonces à tout moment. Pour consulter, corriger ou supprimer vos données ou votre compte, écrivez à emarket.contact.drs@gmail.com.":"Вы можете изменить или удалить свои объявления в любой момент. Чтобы получить доступ к своим данным или аккаунту, исправить или удалить их, пишите на emarket.contact.drs@gmail.com.","7. Conservation":"7. Срок хранения","Vos données sont gardées tant que votre compte existe, ou le temps nécessaire pour traiter un signalement ou un litige.":"Ваши данные хранятся, пока существует Ваш аккаунт, или столько, сколько нужно для рассмотрения жалобы или спора.","23 octobre 2026":"23 октября 2026","Télécom":"Связь","Chaussures et sacs":"Обувь и сумки","Produits de beauté":"Косметика и уход","Cosmétiques":"Косметика","Électroménager":"Бытовая техника","Maison et meubles":"Дом и мебель","Quincaillerie":"Хозтовары","Ferraille":"Металлолом","Pièces dé atif)":"Сообщение для администратора (необязательно)","Envoyer ma demande":"Отправить заявку","Renseignez votre nom complet, votre pays et votre ville.":"Укажите своё полное имя, страну и город.","Ajoutez une photo du justificatif ou un lien de preuve.":"Добавьте фото документа или ссылку-подтверждение.","Le lien doit commencer par https://":"Ссылка должна начинаться с https://","Demande envoyée. Vous serez notifié de la décision.":"Заявка отправлена. Вы получите уведомление о решении.","Justificatif introuvable.":"Документ не найден.","Votre boutique est déjà certifiée.":"Ваш магазин уже сертифицирован.","Vous avez déjà une demande en cours d'examen.":"У Вас уже есть заявка на рассмотрении.","Trop de demandes ce mois-ci. Réessayez plus tard.":"Слишком много заявок в этом месяце. Повторите попытку позже.","Justificatif invalide.":"Недопустимый документ.","Ajoutez un justificatif (photo) ou un lien de preuve (page Facebook, site...).":"Добавьте документ (фото) или ссылку-подтверждение (страница Facebook, сайт…).","Informations invalides. Vérifiez le nom, le pays, la ville et le numéro WhatsApp (format +226 00 00 00 00).":"Недопустимые данные. Проверьте имя, страну, город и номер WhatsApp (формат +226 00 00 00 00).","Connectez-vous pour signaler.":"Войдите, чтобы пожаловаться.","Boutique introuvable.":"Магазин не найден.","Avis introuvable.":"Отзыв не найден.","Vous ne pouvez pas signaler votre propre avis.":"Вы не можете пожаловаться на свой собственный отзыв.","Vous ne pouvez pas signaler votre propre boutique.":"Вы не можете пожаловаться на свой собственный магазин.","Trop de signalements aujourd'hui. Réessayez demain.":"Слишком много жалоб сегодня. Повторите попытку завтра.","Vous avez déjà signalé ceci.":"Вы уже жаловались на это.","Motif invalide.":"Недопустимая причина.","Ce n'est pas votre annonce.":"Это не Ваше объявление.","Trop de messages envoyés. Réessayez dans une heure.":"Отправлено слишком много сообщений. Повторите попытку через час.","Publicité":"Реклама","Téléphone":"Телефон","✉️ Envoyer un e-mail":"✉️ Отправить e-mail","🌐 Visiter le site":"🌐 Перейти на сайт","🔗 Visiter la page":"🔗 Перейти на страницу","Photo précédente":"Предыдущее фото","Photo suivante":"Следующее фото","📲 Installer l'application":"📲 Установить приложение","Sur Chrome : ouvrez le menu ⋮ puis « Ajouter à l'écran d'accueil ».":"В Chrome: откройте меню ⋮, затем «Добавить на главный экран».","Mot de passe (10 caractères minimum)":"Пароль (не менее 10 символов)","Mot de passe : 10 caractères minimum.":"Пароль: не менее 10 символов.","Le mot de passe doit contenir des lettres et des chiffres.":"Пароль должен содержать буквы и цифры.","E-mail invalide.":"Недопустимый e-mail.","🔵 Votre boutique est certifiée !":"🔵 Ваш магазин сертифицирован!","❤️ Une annonce a été ajoutée aux favoris":"❤️ Объявление добавлено в избранное","❤️ Votre boutique a été ajoutée aux favoris":"❤️ Ваш магазин добавлен в избранное","⏰ Votre sponsorisation se termine bientôt":"⏰ Ваше спонсорство скоро закончится","8. Certification et statistiques":"8. Сертификация и статистика","Si vous demandez la certification de votre boutique, vous envoyez votre nom, votre pays, votre ville, votre numéro WhatsApp et un justificatif (photo ou lien). Ces éléments ne sont visibles que par l'administrateur. La photo du justificatif est supprimée dès que la demande est traitée. Le site compte aussi, de façon anonyme, le nombre de visites par jour, sans vous identifier.":"Если Вы запрашиваете сертификацию магазина, Вы отправляете своё имя, страну, город, номер WhatsApp и подтверждающий документ (фото или ссылку). Эти данные видит только администратор. Фото документа удаляется сразу после обработки заявки. Сайт также анонимно считает число посещений в день, не идентифицируя Вас.","Cette image ne peut pas être lue. Essayez une autre photo (JPG ou PNG), ou faites-en une capture d'écran.":"Это изображение не удаётся прочитать. Попробуйте другое фото (JPG или PNG) или сделайте его снимок экрана.","Agr  dina la jox ndigal yu fay yi."],["⭐ Nouvel avis reçu","⭐ New review received","⭐ تقييم جديد","⭐ Xalaat bu bees"],["En créant un compte, vous acceptez les","By creating an account, you accept the","بإنشاء حساب، فإنك توافق على","Bu nga sosee compte, nga nangu"],["conditions d'utilisation","terms of use","شروط الاستخدام","yoon wi ci jëfandikoo"],["et la","and the","و","te"],["politique de confidentialité","privacy policy","سياسة الخصوصية","sutura gi"],["Les textes écrits par les vendeurs sont traduits automatiquement : la qualité peut varier.","Texts written by sellers are translated automatically: quality may vary.","تُترجم النصوص التي يكتبها البائعون تلقائيًا، وقد تختلف جودة الترجمة.","Bindin yu jaaykat yi di ñu tekki ci boppam : mën na am cëslaay."],["Connectez-vous pour donner un avis.","Log in to leave a review.","سجّل الدخول لترك تقييم.","Duggal ngir jox xalaat."],["Note invalide.","Invalid rating.","تقييم غير صالح.","Not bi baaxul."],["Vous pouvez donner un avis après avoir contacté ce vendeur par message.","You can leave a review after contacting this seller by message.","يمكنك ترك تقييم بعد مراسلة هذا البائع.","Mën nga jox xalaat bu nga bindee jaaykat bii."],["Cette annonce a déjà une demande en cours ou en attente.","This listing already has a request in progress or pending.","لهذا الإعلان طلب جارٍ أو قيد الانتظار بالفعل.","Yëgle bii am na ñaan bu ngi dox walla di xaar."],["Trop de demandes en attente. Annulez-en ou faites-les confirmer.","Too many pending requests. Cancel some or have them confirmed.","طلبات كثيرة قيد الانتظار. ألغِ بعضها أو أكّدها.","Ñaan yi xaar ñu bari. Neenal yenn walla wóorlu leen."],["Vous ne pouvez sponsoriser que vos propres annonces disponibles.","You can only sponsor your own available listings.","يمكنك ترويج إعلاناتك المتاحة فقط.","Mën nga fay rekk sa yëgle yi am."]]);
addT([["Conditions d'utilisation","Terms of use","شروط الاستخدام"],["1. Le service","1. The service","1. الخدمة"],["ZooDo est une plateforme de petites annonces. Elle met en relation des vendeurs et des acheteurs. ZooDo ne vend pas les produits, ne les détient pas et ne les livre pas : la vente se conclut directement entre l'acheteur et le vendeur, qui se mettent d'accord sur le prix, la livraison et le paiement.","ZooDo is a classified-ads platform. It connects sellers and buyers. ZooDo does not sell, hold or deliver the products: the sale is concluded directly between the buyer and the seller, who agree on the price, delivery and payment.","ZooDo منصة إعلانات مبوّبة تربط بين البائعين والمشترين. لا تبيع ZooDo المنتجات ولا تحتفظ بها ولا توصّلها: يتم البيع مباشرة بين المشتري والبائع، اللذين يتفقان على السعر والتسليم والدفع."],["2. Votre compte","2. Your account","2. حسابك"],["Vous donnez des informations exactes et vous gardez votre mot de passe secret. Vous êtes responsable de ce qui est fait avec votre compte. Une personne = un compte.","You provide accurate information and keep your password secret. You are responsible for everything done with your account. One person = one account.","تقدّم معلومات صحيحة وتحافظ على سرّية كلمة المرور. أنت مسؤول عن كل ما يتم عبر حسابك. شخص واحد = حساب واحد."],["3. Vos annonces","3. Your listings","3. إعلاناتك"],["Décrivez honnêtement votre produit, avec des photos réelles et le vrai prix. Sont interdits : les produits illégaux, les armes, les drogues, les contrefaçons, les arnaques, les contenus choquants, les annonces en double ou sans rapport avec un produit ou un service. ZooDo peut désactiver ou supprimer une annonce et suspendre un compte qui ne respecte pas ces règles. Les avis laissés sur un vendeur doivent être honnêtes et respectueux : ZooDo peut supprimer un avis abusif.","Describe your product honestly, with real photos and the real price. Prohibited: illegal products, weapons, drugs, counterfeits, scams, offensive content, duplicate listings or listings unrelated to a product or service. ZooDo may deactivate or delete a listing and suspend an account that does not follow these rules. Reviews left about a seller must be honest and respectful: ZooDo may delete an abusive review.","صِف منتجك بصدق، مع صور حقيقية والسعر الحقيقي. يُمنع: المنتجات غير القانونية والأسلحة والمخدرات والمقلّدات والاحتيال والمحتوى الصادم والإعلانات المكررة أو غير المتعلقة بمنتج أو خدمة. يجوز لـ ZooDo تعطيل أي إعلان أو حذفه وتعليق أي حساب لا يحترم هذه القواعد. يجب أن تكون التقييمات المتروكة عن البائع صادقة ومحترمة، ويجوز لـ ZooDo حذف أي تقييم مسيء."],["4. Visibilité sur Facebook","4. Visibility on Facebook","4. الظهور على فيسبوك"],["Pour faire connaître les annonces, ZooDo les republie automatiquement sur sa Page Facebook, avec le nom du produit, le prix, la zone, la description, les photos et un lien vers l'annonce. En publiant une annonce, vous acceptez cette republication.","To promote listings, ZooDo automatically republishes them on its Facebook Page, with the product name, price, area, description, photos and a link to the listing. By publishing a listing, you accept this republication.","للتعريف بالإعلانات، تعيد ZooDo نشرها تلقائيًا على صفحتها في فيسبوك، مع اسم المنتج والسعر والمنطقة والوصف والصور ورابط الإعلان. بنشر إعلان، فإنك توافق على إعادة النشر هذه."],["5. Sponsorisation","5. Sponsorship","5. الترويج"],["La mise en avant d'une annonce est payante. Les tarifs sont affichés dans l'application. La sponsorisation commence quand ZooDo a vérifié votre paiement et dure le temps de la formule choisie.","Promoting a listing is paid. Prices are shown in the app. Sponsorship starts when ZooDo has verified your payment and lasts for the chosen plan.","الترويج بالإعلان مدفوع. الأسعار معروضة في التطبيق. يبدأ الترويج بعد أن تتحقق ZooDo من دفعتك ويستمر طوال مدة الباقة المختارة."],["6. Conseils de sécurité","6. Safety tips","6. نصائح للسلامة"],["Ne payez jamais avant d'avoir vu le produit. Rencontrez-vous dans un lieu public. Méfiez-vous des prix trop bas ou des demandes pressantes. Si une annonce vous semble suspecte, utilisez le bouton « Signaler cette annonce ».","Never pay before seeing the product. Meet in a public place. Beware of prices that are too low or pushy requests. If a listing looks suspicious, use the “Report this listing” button.","لا تدفع أبدًا قبل رؤية المنتج. التقِ في مكان عام. احذر من الأسعار المنخفضة جدًا أو الطلبات المُلحّة. إذا بدا لك إعلان مشبوهًا، فاستخدم زر «🚩 الإبلاغ عن هذا الإعلان»."],["7. Responsabilité","7. Liability","7. المسؤولية"],["ZooDo ne peut pas vérifier chaque annonce ni chaque personne. Dans les limites permises par la loi, ZooDo n'est pas responsable des litiges, des pertes ou des dommages liés à une vente entre utilisateurs.","ZooDo cannot verify every listing or every person. Within the limits permitted by law, ZooDo is not responsible for disputes, losses or damages related to a sale between users.","لا تستطيع ZooDo التحقق من كل إعلان ولا من كل شخص. في حدود ما يسمح به القانون، لا تتحمل ZooDo مسؤولية النزاعات أو الخسائر أو الأضرار المرتبطة بعملية بيع بين المستخدمين."],["8. Changements","8. Changes","8. التغييرات"],["Ces conditions peuvent évoluer. Si vous continuez à utiliser ZooDo après un changement, vous acceptez la nouvelle version.","These terms may change. If you keep using ZooDo after a change, you accept the new version.","قد تتغير هذه الشروط. إذا واصلت استخدام ZooDo بعد أي تغيير، فإنك توافق على النسخة الجديدة."],["9. Contact","9. Contact","9. التواصل"],["Pour toute question, tout problème ou toute demande, écrivez à emarket.contact.drs@gmail.com.","For any question, problem or request, write to emarket.contact.drs@gmail.com.","لأي سؤال أو مشكلة أو طلب، راسلنا على emarket.contact.drs@gmail.com."],["Politique de confidentialité","Privacy policy","سياسة الخصوصية"],["1. Ce que nous collectons","1. What we collect","1. ما نجمعه"],["Votre adresse e-mail, votre nom, le nom de votre boutique, vos numéros WhatsApp et téléphone si vous les ajoutez, vos annonces et leurs photos, vos messages, vos notifications, vos favoris et les avis que vous laissez.","Your email address, your name, your shop name, your WhatsApp and phone numbers if you add them, your listings and their photos, your messages, your notifications, your favorites and the reviews you leave.","عنوان بريدك الإلكتروني واسمك واسم متجرك ورقما واتساب والهاتف إن أضفتهما، وإعلاناتك وصورها ورسائلك وإشعاراتك ومفضلاتك والتقييمات التي تتركها."],["2. Pourquoi","2. Why","2. لماذا"],["Pour faire fonctionner votre compte, afficher vos annonces, permettre aux acheteurs de vous contacter, modérer les annonces signalées et gérer les sponsorisations.","To run your account, display your listings, let buyers contact you, moderate reported listings and manage sponsorships.","لتشغيل حسابك وعرض إعلاناتك وتمكين المشترين من التواصل معك ومراجعة الإعلانات المُبلَّغ عنها وإدارة الترويج."],["3. Ce qui est public","3. What is public","3. ما هو علني"],["Le nom du produit, le prix, la description, les photos, la zone et le nom du vendeur ou de sa boutique sont visibles par tous, et republiés sur la Page Facebook ZooDo. Vos numéros ne sont jamais affichés publiquement : un acheteur connecté ne les obtient que lorsqu'il touche « Contacter sur WhatsApp » ou « Appeler le vendeur ». Les avis que vous laissez (note, commentaire et votre nom) sont publics. Le nombre de vues, de contacts et de partages d'une annonce n'est visible que par son vendeur.","The product name, price, description, photos, area and the name of the seller or their shop are visible to everyone, and republished on the ZooDo Facebook Page. Your numbers are never shown publicly: a signed-in buyer only gets them when they tap “Contact on WhatsApp” or “Call the seller”. The reviews you leave (rating, comment and your name) are public. The number of views, contacts and shares of a listing is visible only to its seller.","اسم المنتج والسعر والوصف والصور والمنطقة واسم البائع أو متجره مرئية للجميع، ويُعاد نشرها على صفحة ZooDo في فيسبوك. لا تُعرض أرقامك علنًا أبدًا: لا يحصل عليها المشتري المسجَّل إلا عندما يلمس «التواصل عبر واتساب» أو «الاتصال بالبائع». التقييمات التي تتركها (التقدير والتعليق واسمك) علنية. عدد المشاهدات والاتصالات والمشاركات الخاصة بإعلان ما لا يراه إلا بائعه."],["4. Partage","4. Sharing","4. المشاركة"],["Nous ne vendons pas vos données. Les annonces publiées sont republiées sur la page Facebook de ZooDo. Pour afficher le site dans la langue choisie, le texte des annonces peut être envoyé à un service de traduction automatique.","We do not sell your data. Published listings are republished on ZooDo's Facebook page. To display the site in the chosen language, the text of listings may be sent to an automatic translation service.","لا نبيع بياناتك. تُعاد نشر الإعلانات المنشورة على صفحة ZooDo في فيسبوك. ولعرض الموقع باللغة المختارة، قد يُرسَل نص الإعلانات إلى خدمة ترجمة آلية."],["5. Stockage sur votre appareil","5. Storage on your device","5. التخزين على جهازك"],["Le site enregistre sur votre appareil vos choix de langue, de devise et de thème, ainsi que votre panier. Il n'y a pas de suivi publicitaire.","The site saves your language, currency and theme choices on your device, as well as your cart. There is no advertising tracking.","يحفظ الموقع على جهازك اختياراتك للغة والعملة والمظهر، وكذلك سلّتك. لا يوجد أي تتبّع إعلاني."],["6. Vos droits","6. Your rights","6. حقوقك"],["Vous pouvez modifier ou supprimer vos annonces à tout moment. Pour consulter, corriger ou supprimer vos données ou votre compte, écrivez à emarket.contact.drs@gmail.com.","You can edit or delete your listings at any time. To view, correct or delete your data or your account, write to emarket.contact.drs@gmail.com.","يمكنك تعديل إعلاناتك أو حذفها في أي وقت. للاطلاع على بياناتك أو حسابك أو تصحيحها أو حذفها، راسلنا على emarket.contact.drs@gmail.com."],["7. Conservation","7. Retention","7. الاحتفاظ"],["Vos données sont gardées tant que votre compte existe, ou le temps nécessaire pour traiter un signalement ou un litige.","Your data is kept as long as your account exists, or for the time needed to handle a report or a dispute.","تُحفظ بياناتك ما دام حسابك قائمًا، أو للمدة اللازمة لمعالجة بلاغ أو نزاع."],["23 octobre 2026","21 October 2026","21 أكتوبر 2026","21 Oktoobar 2026"]]);

addT([["Cette adresse e-mail est déjà utilisée. Connectez-vous.","This email address is already in use. Sign in.","هذا البريد الإلكتروني مستخدم بالفعل. سجّل الدخول.",""],["Inscription momentanément indisponible. Réessayez plus tard.","Sign-up temporarily unavailable. Try again later.","التسجيل غير متاح مؤقتًا. حاول لاحقًا.",""],["Un code à usage unique a été envoyé à","A one-time code was sent to","تم إرسال رمز لمرة واحدة إلى",""],["🔐 Pour votre sécurité, un code de confirmation à usage unique vous sera envoyé par e-mail à chaque connexion et à chaque inscription.","🔐 For your security, a one-time confirmation code will be emailed to you at every sign-in and sign-up.","🔐 لأمانك، سيتم إرسال رمز تأكيد لمرة واحدة إلى بريدك الإلكتروني عند كل تسجيل دخول وكل تسجيل.",""],["Recevoir mon code", "Get my code", "احصل على الرمز", "Jot sa code"], ["🔐 Pas de mot de passe à retenir : à chaque connexion, vous recevez par e-mail un code à usage unique.", "🔐 No password to remember: each time you sign in, you receive a one-time code by email.", "🔐 لا حاجة لتذكر كلمة مرور: في كل تسجيل دخول تتلقى رمزًا لمرة واحدة عبر البريد الإلكتروني.", ""], ["Code reçu par e-mail", "Code received by email", "الرمز المستلم عبر البريد الإلكتروني", ""], ["Valider le code", "Confirm code", "تأكيد الرمز", ""], ["Renvoyer le code", "Resend code", "إعادة إرسال الرمز", ""], ["Changer d'e-mail", "Change email", "تغيير البريد الإلكتروني", ""], ["Il ne fonctionne qu'une seule fois. Vérifiez aussi vos courriers indésirables (spam).", "It only works once. Also check your spam folder.", "لا يعمل إلا مرة واحدة. تحقق أيضًا من البريد المزعج.", ""], ["Code envoyé.", "Code sent.", "تم إرسال الرمز.", ""], ["Entrez le code reçu.", "Enter the code you received.", "أدخل الرمز الذي استلمته.", ""], ["Code invalide ou expiré.", "Invalid or expired code.", "رمز غير صالح أو منتهي.", ""], ["Aucun compte avec cet e-mail. Créez un compte.", "No account with this email. Create an account.", "لا يوجد حساب بهذا البريد. أنشئ حسابًا.", async function utApi(txt,src,tgt){
 const r=await fetch('https://api.mymemory.translated.net/get?q='+encodeURIComponent(txt)+'&langpair='+src+'|'+tgt);
 const j=await r.json(),t=j&&j.responseData&&j.responseData.translatedText,c=+(j&&j.responseStatus);
 if(c===429||/MYMEMORY WARNING|ALL AVAILABLE FREE/i.test(t||'')){UT.off=true;throw new Error('quota')}

 return res.join(' ')}

const SIMMAP=(()=>{const m=new Map();SIMG.forEach(([t,w,l])=>l.split(' ').forEach(k=>{if(!m.has(k))m.set(k,[]);m.get(k).push([t,w])}));return m})();
const SIMKEYS=[...SIMMAP.keys()].filter(k=>k.length>=6);
const simTok=s=>norm(s).replace(/[^a-z0-9\-]+/g,' ').split(' ').filter(w=>w.length>1);
const near=(a,b)=>{if(Math.abs(a.length-b.length)>1)return false;let i=0,j=0,d=0;while(i<a.length&&j<b.length){if(a[i]===b[j]){i++;j++;continue}if(++d>1)return false;if(a.length>b.length)i++;else if(a.length<b.length)j++;else{i++;j++}}return d+(a.length-i)+(b.length-j)<=1};
const simCache=new Map();
function simInfo(p){
 const key=p.id+'|'+p.nom;let r=simCache.get(key);if(r)return r;
 const toks=simTok(p.nom),sc={};
 toks.forEach(w=>{let hit=SIMMAP.get(w);if(!hit&&w.length>=6){const k=SIMKEYS.find(k=>near(w,k));if(k)hit=SIMMAP.get(k)}
  if(hit)hit.forEach(([t,wt])=>{sc[t]=(sc[t]||0)+wt})});
 if(sc.pc&&sc.tel&&toks.some(w=>['ordinateur','laptop','pc','macbook'].includes(w)))delete sc.tel;   /* « ordinateur portable » ≠ téléphone */
 if(sc.acc)sc.acc+=1;
 let type=null,best=0;for(const t in sc)if(sc[t]>best){best=sc[t];type=t}
 const words=new Set(toks.filter(w=>w.length>2&&!FRW.has(w)&&!/^\d+$/.test(w)));
 r={type,words};simCache.set(key,r);return r;
}
function simScore(p,x){
 const a=simInfo(p),b=simInfo(x);let s=0;
 const sameType=!!(a.type&&b.type&&a.type===b.type);
 if(a.type!==b.type)return 0;                              /* un téléphone n'est jamais proposé à côté d'un sac */
 if(sameType)s+=100;
 let sh=0;a.words.forEach(w=>{if(b.words.has(w))sh++});s+=Math.min(sh,3)*(sameType?12:22);   /* marque, modèle… */
 if(x.categorie===p.categorie)s+=sameType?15:25;else if(!sameType)return 0;
 if(!sameType&&sh<2)return 0;
 const lo=Math.min(p.prix,x.prix),hi=Math.max(p.prix,x.prix),r=hi>0?lo/hi:0;s+=r>=.5?20*r:r<.2?-20:0;     /* prix proche */
 if(norm(p.zone||'')&&norm(p.zone||'')===norm(x.zone||''))s+=10;
 return s;
}
function simPick(p){
 const pool=vis().filter(x=>x.id!==p.id&&x.quantite>0).map(x=>[x,simScore(p,x)]).filter(z=>z[1]>=30).sort((u,v)=>v[1]-u[1]);
 const others=[],seen=new Set(),same=[];
 pool.forEach(([x])=>{if(x.seller_id===p.seller_id){if(same.length<2)same.push(x);return}if(!seen.has(x.seller_id)&&others.length<4){seen.add(x.seller_id);others.push(x)}});
 if(others.length<4)pool.forEach(([x])=>{if(x.seller_id!==p.seller_id&&!others.includes(x)&&others.length<4)others.push(x)});   /* complète avec un 2ᵉ article d'un même vendeur */
 return {others,same};
}
