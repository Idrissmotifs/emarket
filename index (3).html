h1,h2,h3{font-family:'Bricolage Grotesque','Instrument Sans',system-ui,sans-serif;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
header{position:sticky;top:0;z-index:5;background:var(--hdr);color:#fff;padding:calc(10px + env(safe-area-inset-top,0px)) 14px 12px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.logo{display:flex;align-items:center;min-width:0;font:800 24px 'Bricolage Grotesque',system-ui,sans-serif;letter-spacing:-.5px}
.logo img{display:block;width:230px;max-width:52vw;height:64px;object-fit:contain;background:transparent;border-radius:0;padding:0}
.tb{display:flex;gap:6px;align-items:center}[hidden]{display:none!important}
#nb{background:var(--acc);color:#14231C;border-radius:10px;padding:0 6px;font-size:12px;margin-left:3px}
.unr{border-inline-start:4px solid var(--acc)}
.box button.nbtn{all:unset;display:block;width:100%;cursor:pointer}
.le{display:inline-grid;place-items:center;width:34px;height:34px;background:var(--acc);color:#0E6B4F;border-radius:10px;font:italic 700 24px Georgia,serif;transform:rotate(-6deg);margin-right:3px;vertical-align:middle}
#cn{background:var(--acc);color:#14231C;border-radius:10px;padding:0 6px;font-size:12px}
.box.ci{display:flex;gap:10px}.ci .pic{width:72px;height:72px;aspect-ratio:auto;border-radius:10px;flex:none;font-size:30px}
.qty{display:flex;align-items:center;gap:8px;margin-top:6px}.qty>button:not(.btn){width:34px;height:34px;border-radius:50%;border:1.5px solid var(--line);background:var(--surf);font-size:18px;padding:0}
.ib{background:rgba(255,255,255,.16);color:#fff;border:1px solid rgba(255,255,255,.18);border-radius:999px;padding:7px 12px;backdrop-filter:blur(6px);transition:background .15s,transform .1s}.ib:hover{background:rgba(255,255,255,.26)}.ib:active{transform:scale(.94)}
.sb{display:flex;border-radius:999px;overflow:hidden;background:#fff;box-shadow:0 4px 14px -4px rgba(0,0,0,.35);padding:3px}
.sb input{flex:1;min-width:0;border:0;padding:10px 16px;background:#fff;color:#14231C;border-radius:999px}.sb input:focus{outline:none}
.sb button{border:0;background:linear-gradient(135deg,#FFC93C,var(--acc));color:#14231C;padding:0 18px;font-size:17px;border-radius:999px;transition:transform .1s}.sb button:active{transform:scale(.93)}
main{max-width:760px;margin:0 auto;padding:12px 14px}
.hero{background:linear-gradient(135deg,var(--hdr),#14946A);color:#fff;border-radius:22px;padding:20px;margin-bottom:14px;box-shadow:0 10px 24px -10px var(--glow)}
.hero h2{font-size:23px;line-height:1.15;margin-bottom:6px}.hero p{margin:0 0 12px;opacity:.9}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}.pills span{font-size:12px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.2);border-radius:999px;padding:4px 11px}
.cats{display:flex;gap:12px;overflow-x:auto;padding:2px 0 12px}
.ct{flex:none;width:78px;text-align:center;background:none;border:0;padding:0;color:var(--ink);font-size:12px}
.ct b{display:grid;place-items:center;width:56px;height:56px;margin:0 auto 4px;border-radius:50%;background:var(--surf);border:2px solid var(--line);font-size:26px;font-weight:400;box-shadow:0 3px 8px -4px rgba(0,0,0,.25);transition:transform .12s,border-color .12s}.ct:active b{transform:scale(.92)}
.ct.on b{border-color:var(--pri);background:var(--soft);box-shadow:0 0 0 4px var(--soft)}.ct.on{font-weight:600}
.fl{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.fl select{grid-column:1/-1}
input,select,textarea{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:14px;background:var(--surf);transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--pri);box-shadow:0 0 0 4px var(--soft)}
.cnt{color:var(--mute);margin:0 0 8px;font-size:13px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media(min-width:560px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.card{background:var(--surf);border:1px solid var(--line);border-radius:18px;overflow:hidden;text-align:left;padding:0;display:block;width:100%;box-shadow:0 4px 14px -8px rgba(0,0,0,.3);transition:transform .15s,box-shadow .15s}.card:hover{transform:translateY(-2px);box-shadow:0 10px 20px -10px rgba(0,0,0,.35)}.card:active{transform:scale(.98)}
.pic{aspect-ratio:1/.8;display:grid;place-items:center;font-size:54px;background:var(--soft);overflow:hidden}
.pic img{width:100%;height:100%;object-fit:cover}
.in{padding:9px 11px 12px}.in h3{font:600 14px/1.3 'Instrument Sans',system-ui,sans-serif;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:36px}
.price{font:800 18px 'Bricolage Grotesque',system-ui,sans-serif;color:var(--pri);margin-top:4px}
.sub{color:var(--mute);font-size:12.5px}
.warn{background:var(--wait);color:var(--waitink);border-radius:14px;padding:10px 12px;font-size:13.5px;margin:10px 0}.pv .old{opacity:.95}
.tag.spo{background:linear-gradient(135deg,#FFC93C,var(--acc));color:#14231C;font-weight:700}
.sec{margin:16px 0 8px}.sec h3{margin:0}
.ad{display:flex;gap:12px;align-items:center;background:var(--surf);border:1px solid var(--line);border-radius:18px;padding:10px;text-decoration:none;color:var(--ink);margin:12px 0;box-shadow:0 4px 14px -10px rgba(0,0,0,.3)}
.ad img{width:96px;height:72px;object-fit:cover;border-radius:12px;flex:none}.ad small{display:block;color:var(--mute);font-size:11px}.ad b{display:block}.ad span{font-size:13px;color:var(--mute)}
.ad.ban{flex-direction:column;align-items:stretch}.ad.ban img{width:100%;height:auto;max-height:150px}
.btn.wa{background:linear-gradient(135deg,#2BD96B,#1FAF54);color:#06210f;--glow:rgba(31,175,84,.45)}
.tag{display:inline-block;font-size:11.5px;padding:2px 9px;border-radius:999px;background:var(--soft);margin:4px 4px 0 0}.tag.low{background:var(--wait);color:var(--waitink)}
nav{position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));max-width:560px;margin:0 auto;z-index:6;background:var(--surf);border:1px solid var(--line);border-radius:26px;display:flex;padding:6px;box-shadow:0 10px 30px -8px rgba(0,0,0,.4)}
nav button{flex:1;border:0;background:none;padding:7px 2px;border-radius:20px;color:var(--mute);font-size:12px;transition:background .15s,color .15s}
nav button b{display:block;font-size:19px;font-weight:400}nav button.on{color:var(--pri);font-weight:600;background:var(--soft)}nav button:active{transform:scale(.94)}
.btn{background:linear-gradient(135deg,var(--pri),var(--pri2));color:var(--onpri);border:0;border-radius:999px;padding:13px 20px;font-weight:600;letter-spacing:.1px;width:100%;box-shadow:0 4px 12px -3px var(--glow),inset 0 1px 0 rgba(255,255,255,.18);transition:transform .12s ease,box-shadow .12s ease,filter .12s ease}
.btn:hover{filter:brightness(1.06);box-shadow:0 6px 16px -3px var(--glow),inset 0 1px 0 rgba(255,255,255,.18)}.btn:active{transform:scale(.97);box-shadow:0 2px 6px -2px var(--glow)}
.btn.acc{background:linear-gradient(135deg,#FFC93C,var(--acc));color:#14231C;--glow:rgba(242,169,0,.5)}
.btn.alt{background:var(--soft);color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}.btn.alt:hover{box-shadow:inset 0 0 0 1.5px var(--pri)}
.btn.bad{background:linear-gradient(135deg,#D8453B,var(--err));color:#fff;--glow:rgba(179,38,30,.45)}
.btn.sm{width:auto;padding:9px 16px;font-size:14px}.btn[disabled]{opacity:.45;box-shadow:none;transform:none;filter:grayscale(.3)}
@media(prefers-reduced-motion:reduce){.btn,.card,nav button{transition:none}}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.lnk{background:none;border:0;padding:0;color:var(--pri);text-decoration:underline;font:inherit;cursor:pointer}.lg h3{margin:14px 0 4px}.lg p{margin:0 0 6px;font-size:14px;line-height:1.5}
.f label{display:block;margin:12px 0 4px;font-weight:600}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:10;display:flex;align-items:flex-end;justify-content:center}
.sheet>div{background:var(--bg);width:100%;max-width:580px;max-height:93%;overflow:auto;border-radius:28px 28px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom,0px))}
.big{height:220px;font-size:80px;border-radius:14px;display:grid;place-items:center;background:var(--soft);margin-bottom:8px;overflow:hidden}.big img{width:100%;height:100%;object-fit:contain}
.th{display:flex;gap:8px;overflow-x:auto;margin-bottom:10px}.th img{width:60px;height:60px;object-fit:cover;border-radius:8px;border:2px solid transparent;flex:none}.th img.on{border-color:var(--pri)}
.row{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px solid var(--line)}
.box{background:var(--surf);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px;box-shadow:0 4px 14px -10px rgba(0,0,0,.3)}
.box h3{font-size:16px}.box p{margin:4px 0}
.st{display:inline-block;padding:3px 10px;border-radius:20px;font-size:12.5px;font-weight:600;background:var(--wait);color:var(--waitink)}.st.ok{background:var(--soft);color:var(--pri)}.st.bad{background:var(--errbg);color:var(--err)}
.steps{display:flex;gap:3px;margin:10px 0}.steps span{flex:1;height:6px;border-radius:3px;background:var(--line)}.steps span.d{background:var(--pri)}
.code{font:800 32px/1 'Bricolage Grotesque',system-ui,sans-serif;letter-spacing:8px;color:var(--pri)}
.cbox{background:var(--wait);border:2px dashed var(--acc);border-radius:12px;padding:10px;margin-top:10px;text-align:center;color:var(--ink)}
.msg{padding:10px 12px;border-radius:10px;background:var(--soft);margin:8px 0}.msg.err{background:var(--errbg);color:var(--err)}
.empty{text-align:center;color:var(--mute);padding:36px 10px}.note{font-size:13px;color:var(--mute);margin:8px 0 0}
.tabs{display:flex;gap:4px;margin:10px 0;background:var(--soft);padding:4px;border-radius:999px}.tabs button{flex:1;border:0;border-radius:999px;padding:10px;background:none;font-weight:600;transition:background .15s}.tabs button.on{background:var(--pri);color:var(--onpri);box-shadow:0 3px 8px -3px var(--glow)}
.pv{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px}.pv div{position:relative;width:76px;height:76px}.pv img{width:100%;height:100%;object-fit:cover;border-radius:10px}
.pv button{position:absolute;top:-8px;right:-8px;width:24px;height:24px;border-radius:50%;border:0;background:var(--err);color:#fff;padding:0}
.chat{display:flex;flex-direction:column;gap:6px;margin:10px 0;max-height:55vh;overflow-y:auto;padding:4px}
.bub{max-width:80%;padding:9px 14px;border-radius:20px;background:var(--surf);border:1px solid var(--line);align-self:flex-start;word-break:break-word}
.bub.me{align-self:flex-end;background:var(--pri);color:var(--onpri);border-color:var(--pri)}
.bub small{display:block;opacity:.65;font-size:11px;margin-top:2px}
.cin{display:flex;gap:8px}.cin input{flex:1}.cin .btn{width:auto}
.stat{display:grid;grid-template-columns:1fr 1fr;gap:8px}.stat div{background:var(--surf);border:1px solid var(--line);border-radius:12px;padding:10px;color:var(--mute);font-size:13px}.stat b{display:block;font:800 19px 'Bricolage Grotesque',system-ui,sans-serif;color:var(--pri)}
#toast{position:fixed;left:50%;bottom:104px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;z-index:20;display:none;max-width:90%;box-shadow:0 8px 20px -6px rgba(0,0,0,.45)}
.card{position:relative}
.fv{position:absolute;top:8px;inset-inline-end:8px;z-index:2;width:34px;height:34px;display:grid;place-items:center;border-radius:50%;background:rgba(255,255,255,.92);color:#8a8a8a;font-size:20px;line-height:1;box-shadow:0 2px 6px rgba(0,0,0,.25);cursor:pointer}.fv.on{color:#D6285A}
.lnk{all:unset;cursor:pointer;color:var(--pri);font-weight:600;text-decoration:underline}.lnk:focus-visible{outline:2px solid var(--acc)}
.tag.ver{background:var(--soft);color:var(--pri);font-weight:700}
.stt{display:inline-block;margin-inline-end:10px;font-size:13px;color:var(--mute)}.stt b{color:var(--ink)}
.stars{color:#F2A900;letter-spacing:1px}
.tabs{overflow-x:auto}.tabs button{flex:1 0 auto;white-space:nowrap;padding:10px 12px}
.rs{display:flex;gap:6px;justify-content:center;margin:10px 0}.rs button{all:unset;cursor:pointer;font-size:36px;color:#F2A900;line-height:1;padding:2px 4px}
.sl{display:flex;align-items:center;gap:6px;height:44px;padding:0 10px;min-width:0;cursor:pointer;font-size:13px}.sl b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.av{flex:none;width:28px;height:28px;border-radius:50%;object-fit:cover;display:inline-grid;place-items:center;color:#fff;font:700 14px 'Instrument Sans',system-ui,sans-serif;background:var(--pri)}.av.big{width:76px;height:76px;font-size:32px;border:4px solid var(--surf)}
.vb{display:inline-flex;line-height:0;flex:none;vertical-align:middle;margin-inline-start:3px}.vbd{width:17px;height:17px}.shh h2 .vbd{width:22px;height:22px}
.shp{background:var(--surf);border:1px solid var(--line);border-radius:18px;overflow:hidden;margin-top:10px}
.cover{height:130px;background:linear-gradient(135deg,var(--pri),var(--pri2));overflow:hidden}.cover img{width:100%;height:100%;object-fit:cover;display:block}
.shh{display:flex;padding:0 14px;margin-top:-40px;position:relative}.shn2{padding:8px 14px 0}.shn2 h2{font-size:21px;line-height:1.25;overflow-wrap:anywhere}.zm{cursor:zoom-in}
#lb{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.93);display:flex;align-items:center;justify-content:center;cursor:zoom-out}#lb img{max-width:100%;max-height:100%;object-fit:contain}.lbc{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));inset-inline-end:14px;width:42px;height:42px;border-radius:50%;border:0;background:rgba(255,255,255,.2);color:#fff;font-size:20px}.shh .shn{min-width:0;padding-bottom:4px}.shh h2{font-size:21px;line-height:1.2;overflow-wrap:anywhere}
.shd{margin:10px 14px 0}.shi{padding:6px 14px 0}.shp .acts{padding:10px 14px 14px}
.fv{top:52px}.shi a{color:var(--pri);font-weight:600;overflow-wrap:anywhere}

button.ad{width:100%;text-align:start;font:inherit;cursor:pointer}a.btn{display:block;text-align:center;text-decoration:none}.adimg{border-radius:14px;overflow:hidden;margin-bottom:8px;cursor:zoom-in}.adimg img{width:100%;max-height:220px;object-fit:cover;display:block}
.big.zm{cursor:zoom-in}.lbs{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:56px;border:0;border-radius:12px;background:rgba(255,255,255,.2);color:#fff;font-size:30px}.lbs.pv{left:8px}.lbs.nx{right:8px}.lbi{position:absolute;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:0;right:0;text-align:center;color:#fff;font-size:13px}
#lb.zz{overflow:auto;align-items:flex-start;justify-content:flex-start;cursor:zoom-out}#lb.zz img{max-width:none;max-height:none;width:230%}
.vbar{display:flex;align-items:flex-end;gap:4px;height:90px;margin:6px 0}.vbar span{flex:1;background:var(--pri);border-radius:4px 4px 0 0;min-height:4px}
/* ===== Modernisation : boutons, barre du bas, menu 3 traits (couleurs d'origine conservées) ===== */
.tb{gap:8px}
.tb .ib{position:relative;width:42px;height:42px;padding:0;border-radius:50%;display:grid;place-items:center}
.ib svg{width:22px;height:22px;fill:none;stroke:#fff;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
#cn,#nb{position:absolute;top:-3px;right:-3px;min-width:18px;height:18px;line-height:18px;padding:0 5px;border-radius:9px;font-size:11px;text-align:center;margin:0}
.btn{background:var(--pri);border-radius:14px;padding:13px 20px;letter-spacing:0;box-shadow:0 1px 2px rgba(0,0,0,.12),0 8px 16px -10px var(--glow)}
.btn:hover{filter:none;background:var(--pri2)}
.btn.sm{border-radius:12px}
nav{left:0;right:0;bottom:0;max-width:none;margin:0;border:0;border-top:1px solid var(--line);border-radius:0;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));box-shadow:0 -8px 24px -12px rgba(0,0,0,.28)}
nav button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 2px;border-radius:12px;background:none;font-size:11.5px;font-weight:500;color:var(--mute)}
nav button b{display:grid;place-items:center;width:56px;height:30px;border-radius:15px;transition:background .2s,transform .2s}
nav button svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button.on{background:none;color:var(--pri);font-weight:700}
nav button.on b{background:var(--soft)}nav button.on svg{stroke-width:2.2}
nav button:active b{transform:scale(.92)}
.mn{display:grid;gap:8px;margin-top:12px}
.mn hr{border:0;border-top:1px solid var(--line);margin:4px 0;width:100%}
.mn button{all:unset;box-sizing:border-box;display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;padding:14px 16px;border-radius:14px;background:var(--surf);border:1px solid var(--line);font-weight:600;cursor:pointer;transition:border-color .15s,background .15s}
.mn button::after{content:"›";color:var(--mute);font-size:20px;line-height:1}
.mn button:hover{border-color:var(--pri);background:var(--soft)}
.mn button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.mn button.bad{color:var(--err)}.mn button.bad::after{content:""}
/* ===== Bords plus arrondis : boutons et annonces ===== */
.btn,.btn.sm,.btn.alt,.btn.acc,.btn.bad,.btn.wa{border-radius:999px}
.mn button{border-radius:999px;padding:14px 20px}
.tabs,.tabs button{border-radius:999px}
nav button{border-radius:20px}
.card{border-radius:24px}
.in{padding:10px 14px 14px}
.card .pic{border-radius:0}
.ad,.box,.shp{border-radius:24px}
.ad img{border-radius:18px}
.adimg{border-radius:22px}
.big{border-radius:24px}
.th img{border-radius:14px}
.ci .pic,.pv img{border-radius:16px}
.hero{border-radius:28px}
.sheet>div{border-radius:32px 32px 0 0}
input,select,textarea{border-radius:18px}
.stat div,.warn,.cbox,.msg{border-radius:18px}
.tag{border-radius:999px}
/* ===== Palette bleue + finitions premium ===== */
:root{--bg:#F3F6FC;--surf:#fff;--ink:#0F1B33;--mute:#5A6785;--line:#E1E8F5;--pri:#1D5FD8;--pri2:#3B82F6;--glow:rgba(29,95,216,.38);--onpri:#fff;--hdr:#123C94;--hdr2:#2F7BFF;--soft:#E7EFFD;--sh:rgba(29,95,216,.35)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0B1220;--surf:#131D33;--ink:#E8EEFB;--mute:#9AA9C7;--line:#25324D;--pri:#6EA2FF;--pri2:#8FB8FF;--glow:rgba(110,162,255,.3);--onpri:#06142E;--hdr:#0F2754;--hdr2:#1F4FB5;--soft:#182848;--sh:rgba(0,0,0,.6)}}
:root[data-theme="dark"]{--bg:#0B1220;--surf:#131D33;--ink:#E8EEFB;--mute:#9AA9C7;--line:#25324D;--pri:#6EA2FF;--pri2:#8FB8FF;--glow:rgba(110,162,255,.3);--onpri:#06142E;--hdr:#0F2754;--hdr2:#1F4FB5;--soft:#182848;--sh:rgba(0,0,0,.6)}
body{background:radial-gradient(900px 320px at 50% -80px,var(--soft),transparent 70%) no-repeat,var(--bg)}
header{background:linear-gradient(160deg,var(--hdr),var(--hdr2));border-radius:0 0 26px 26px;box-shadow:0 14px 30px -16px var(--hdr);padding-bottom:16px}
.sb{box-shadow:0 10px 24px -12px rgba(0,0,0,.55)}
.le{color:var(--hdr)}
.hero{position:relative;overflow:hidden;background:linear-gradient(135deg,var(--hdr),var(--hdr2) 65%,#7DB0FF);box-shadow:0 18px 36px -20px var(--hdr)}
.hero>*{position:relative;z-index:1}
.hero::before,.hero::after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.13);pointer-events:none}
.hero::before{width:190px;height:190px;right:-50px;top:-70px}
.hero::after{width:110px;height:110px;right:70px;bottom:-60px;background:rgba(255,255,255,.09)}
.hero h2{font-size:24px;letter-spacing:-.3px}
.pills span{background:rgba(255,255,255,.18);backdrop-filter:blur(4px)}
.ct b{border:2px solid transparent;background:linear-gradient(var(--surf),var(--surf)) padding-box,linear-gradient(135deg,var(--pri),var(--acc)) border-box;box-shadow:0 8px 16px -10px var(--sh)}

 بتعليمات الدفع.","ZooDo dina la jox ndigal yu fay yi."],["⭐ Nouvel avis reçu","⭐ New review received","⭐ تقييم جديد","⭐ Xalaat bu bees"],["En créant un compte, vous acceptez les","By creating an account, you accept the","بإنشاء حساب، فإنك توافق على","Bu nga sosee compte, nga nangu"],["conditions d'utilisation","terms of use","شروط الاستخدام","yoon wi ci jëfandikoo"],["et la","and the","و","te"],["politique de confidentialité","privacy policy","سياسة الخصوصية","sutura gi"],["Les textes écrits par les vendeurs sont traduits automatiquement : la qualité peut varier.","Texts written by sellers are translated automatically: quality may vary.","تُترجم النصوص التي يكتبها البائعون تلقائيًا، وقد تختلف جودة الترجمة.","Bindin yu jaaykat yi di ñu tekki ci boppam : mën na am cëslaay."],["Connectez-vous pour donner un avis.","Log in to leave a review.","سجّل الدخول لترك تقييم.","Duggal ngir jox xalaat."],["Note invalide.","Invalid rating.","تقييم غير صالح.","Not bi baaxul."],["Vous pouvez donner un avis après avoir contacté ce vendeur par message.","You can leave a review after contacting this seller by message.","يمكنك ترك تقييم بعد مراسلة هذا البائع.","Mën nga jox xalaat bu nga bindee jaaykat bii."],["Cette annonce a déjà une demande en cours ou en attente.","This listing already has a request in progress or pending.","لهذا الإعلان طلب جارٍ أو قيد الانتظار بالفعل.","Yëgle bii am na ñaan bu ngi dox walla di xaar."],["Trop de demandes en attente. Annulez-en ou faites-les confirmer.","Too many pending requests. Cancel some or have them confirmed.","طلبات كثيرة قيد الانتظار. ألغِ بعضها أو أكّدها.","Ñaan yi xaar ñu bari. Neenal yenn walla wóorlu leen."],["Vous ne pouvez sponsoriser que vos propres annonces disponibles.","You can only sponsor your own available listings.","يمكنك ترويج إعلاناتك المتاحة فقط.","Mën nga fay rekk sa yëgle yi am."]]);
addT([["Conditions d'utilisation","Terms of use","شروط الاستخدام"],["1. Le service","1. The service","1. الخدمة"],["ZooDo est une plateforme de petites annonces. Elle met en relation des vendeurs et des acheteurs. ZooDo ne vend pas les produits, ne les détient pas et ne les livre pas : la vente se conclut directement entre l'acheteur et le vendeur, qui se mettent d'accord sur le prix, la livraison et le paiement.","ZooDo is a classified-ads platform. It connects sellers and buyers. ZooDo does not sell, hold or deliver the products: the sale is concluded directly between the buyer and the seller, who agree on the price, delivery and payment.","ZooDo منصة إعلانات مبوّبة تربط بين البائعين والمشترين. لا تبيع ZooDo المنتجات ولا تحتفظ بها ولا توصّلها: يتم البيع مباشرة بين المشتري والبائع، اللذين يتفقان على السعر والتسليم والدفع."],["2. Votre compte","2. Your account","2. حسابك"],["Vous donnez des informations exactes et vous gardez votre mot de passe secret. Vous êtes responsable de ce qui est fait avec votre compte. Une personne = un compte.","You provide accurate information and keep your password secret. You are responsible for everything done with your account. One person = one account.","تقدّم معلومات صحيحة وتحافظ على سرّية كلمة المرور. أنت مسؤول عن كل ما يتم عبر حسابك. شخص واحد = حساب واحد."],["3. Vos annonces","3. Your listings","3. إعلاناتك"],["Décrivez honnêtement votre produit, avec des photos réelles et le vrai prix. Sont interdits : les produits illégaux, les armes, les drogues, les contrefaçons, les arnaques, les contenus choquants, les annonces en double ou sans rapport avec un produit ou un service. ZooDo peut désactiver ou supprimer une annonce et suspendre un compte qui ne respecte pas ces règles. Les avis laissés sur un vendeur doivent être honnêtes et respectueux : ZooDo peut supprimer un avis abusif.","Describe your product honestly, with real photos and the real price. Prohibited: illegal products, weapons, drugs, counterfeits, scams, offensive content, duplicate listings or listings unrelated to a product or service. ZooDo may deactivate or delete a listing and suspend an account that does not follow these rules. Reviews left about a seller must be honest and respectful: ZooDo may delete an abusive review.","صِف منتجك بصدق، مع صور حقيقية والسعر الحقيقي. يُمنع: المنتجات غير القانونية والأسلحة والمخدرات والمقلّدات والاحتيال والمحتوى الصادم والإعلانات المكررة أو غير المتعلقة بمنتج أو خدمة. يجوز لـ ZooDo تعطيل أي إعلان أو حذفه وتعليق أي حساب لا يحترم هذه القواعد. يجب أن تكون التقييمات المتروكة عن البائع صادقة ومحترمة، ويجوز لـ ZooDo حذف أي تقييم مسيء."],["4. Visibilité sur Facebook","4. Visibility on Facebook","4. الظهور على فيسبوك"],["Pour faire connaître les annonces, ZooDo les republie automatiquement sur sa Page Facebook, avec le nom du produit, le prix, la zone, la description, les photos et un lien vers l'annonce. En publiant une annonce, vous acceptez cette republication.","To promote listings, ZooDo automatically republishes them on its Facebook Page, with the product name, price, area, description, photos and a link to the listing. By publishing a listing, you accept this republication.","للتعريف بالإعلانات، تعيد ZooDo نشرها تلقائيًا على صفحتها في فيسبوك، مع اسم المنتج والسعر والمنطقة والوصف والصور ورابط الإعلان. بنشر إعلان، فإنك توافق على إعادة النشر هذه."],["5. Sponsorisation","5. Sponsorship","5. الترويج"],["La mise en avant d'une annonce est payante. Les tarifs sont affichés dans l'application. La sponsorisation commence quand ZooDo a vérifié votre paiement et dure le temps de la formule choisie.","Promoting a listing is paid. Prices are shown in the app. Sponsorship starts when ZooDo has verified your payment and lasts for the chosen plan.","الترويج بالإعلان مدفوع. الأسعار معروضة في التطبيق. يبدأ الترويج بعد أن تتحقق ZooDo من دفعتك ويستمر طوال مدة الباقة المختارة."],["6. Conseils de sécurité","6. Safety tips","6. نصائح للسلامة"],["Ne payez jamais avant d'avoir vu le produit. Rencontrez-vous dans un lieu public. Méfiez-vous des prix trop bas ou des demandes pressantes. Si une annonce vous semble suspecte, utilisez le bouton « Signaler cette annonce ».","Never pay before seeing the product. Meet in a public place. Beware of prices that are too low or pushy requests. If a listing looks suspicious, use the “Report this listing” button.","لا تدفع أبدًا قبل رؤية المنتج. التقِ في مكان عام. احذر من الأسعار المنخفضة جدًا أو الطلبات المُلحّة. إذا بدا لك إعلان مشبوهًا، فاستخدم زر «🚩 الإبلاغ عن هذا الإعلان»."],["7. Responsabilité","7. Liability","7. المسؤولية"],["ZooDo ne peut pas vérifier chaque annonce ni chaque personne. Dans les limites permises par la loi, ZooDo n'est pas responsable des litiges, des pertes ou des dommages liés à une vente entre utilisateurs.","ZooDo cannot verify every listing or every person. Within the limits permitted by law, ZooDo is not responsible for disputes, losses or damages related to a sale between users.","لا تستطيع ZooDo التحقق من كل إعلان ولا من كل شخص. في حدود ما يسمح به القانون، لا تتحمل ZooDo مسؤولية النزاعات أو الخسائر أو الأضرار المرتبطة بعملية بيع بين المستخدمين."],["8. Changements","8. Changes","8. التغييرات"],["Ces conditions peuvent évoluer. Si vous continuez à utiliser ZooDo après un changement, vous acceptez la nouvelle version.","These terms may change. If you keep using ZooDo after a change, you accept the new version.","قد تتغير هذه الشروط. إذا واصلت استخدام ZooDo بعد أي تغيير، فإنك توافق على النسخة الجديدة."],["9. Contact","9. Contact","9. التواصل"],["Pour toute question, tout problème ou toute demande, écrivez à emarket.contact.drs@gmail.com.","For any question, problem or request, write to emarket.contact.drs@gmail.com.","لأي سؤال أو مشكلة أو طلب، راسلنا على emarket.contact.drs@gmail.com."],["Politique de confidentialité","Privacy policy","سياسة الخصوصية"],["1. Ce que nous collectons","1. What we collect","1. ما نجمعه"],["Votre adresse e-mail, votre nom, le nom de votre boutique, vos numéros WhatsApp et téléphone si vous les ajoutez, vos annonces et leurs photos, vos messages, vos notifications, vos favoris et les avis que vous laissez.","Your email address, your name, your shop name, your WhatsApp and phone numbers if you add them, your listings and their photos, your messages, your notifications, your favorites and the reviews you leave.","عنوان بريدك الإلكتروني واسمك واسم متجرك ورقما واتساب والهاتف إن أضفتهما، وإعلاناتك وصورها ورسائلك وإشعاراتك ومفضلاتك والتقييمات التي تتركها."],["2. Pourquoi","2. Why","2. لماذا"],["Pour faire fonctionner votre compte, afficher vos annonces, permettre aux acheteurs de vous contacter, modérer les annonces signalées et gérer les sponsorisations.","To run your account, display your listings, let buyers contact you, moderate reported listings and manage sponsorships.","لتشغيل حسابك وعرض إعلاناتك وتمكين المشترين من التواصل معك ومراجعة الإعلانات المُبلَّغ عنها وإدارة الترويج."],["3. Ce qui est public","3. What is public","3. ما هو علني"],["Le nom du produit, le prix, la description, les photos, la zone et le nom du vendeur ou de sa boutique sont visibles par tous, et republiés sur la Page Facebook ZooDo. Vos numéros ne sont jamais affichés publiquement : un acheteur connecté ne les obtient que lorsqu'il touche « Contacter sur WhatsApp » ou « Appeler le vendeur ». Les avis que vous laissez (note, commentaire et votre nom) sont publics. Le nombre de vues, de contacts et de partages d'une annonce n'est visible que par son vendeur.","The product name, price, description, photos, area and the name of the seller or their shop are visible to everyone, and republished on the ZooDo Facebook Page. Your numbers are never shown publicly: a signed-in buyer only gets them when they tap “Contact on WhatsApp” or “Call the seller”. The reviews you leave (rating, comment and your name) are public. The number of views, contacts and shares of a listing is visible only to its seller.","اسم المنتج والسعر والوصف والصور والمنطقة واسم البائع أو متجره مرئية للجميع، ويُعاد نشرها على صفحة ZooDo في فيسبوك. لا تُعرض أرقامك علنًا أبدًا: لا يحصل عليها المشتري المسجَّل إلا عندما يلمس «التواصل عبر واتساب» أو «الاتصال بالبائع». التقييمات التي تتركها (التقدير والتعليق واسمك) علنية. عدد المشاهدات والاتصالات والمشاركات الخاصة بإعلان ما لا يراه إلا بائعه."],["4. Partage","4. Sharing","4. المشاركة"],["Nous ne vendons pas vos données. Les annonces publiées sont republiées sur la page Facebook de ZooDo. Pour afficher le site dans la langue choisie, le texte des annonces peut être envoyé à un service de traduction automatique.","We do not sell your data. Published listings are republished on ZooDo's Facebook page. To display the site in the chosen language, the text of listings may be sent to an automatic translation service.","لا نبيع بياناتك. تُعاد نشر الإعلانات المنشورة على صفحة ZooDo في فيسبوك. ولعرض الموقع باللغة المختارة، قد يُرسَل نص الإعلانات إلى خدمة ترجمة آلية."],["5. Stockage sur votre appareil","5. Storage on your device","5. التخزين على جهازك"],["Le site enregistre sur votre appareil vos choix de langue, de devise et de thème, ainsi que votre panier. Il n'y a pas de suivi publicitaire.","The site saves your language, currency and theme choices on your device, as well as your cart. There is no advertising tracking.","يحفظ الموقع على جهازك اختياراتك للغة والعملة والمظهر، وكذلك سلّتك. لا يوجد أي تتبّع إعلاني."],["6. Vos droits","6. Your rights","6. حقوقك"],["Vous pouvez modifier ou supprimer vos annonces à tout moment. Pour consulter, corriger ou supprimer vos données ou votre compte, écrivez à emarket.contact.drs@gmail.com.","You can edit or delete your listings at any time. To view, correct or delete your data or your account, write to emarket.contact.drs@gmail.com.","يمكنك تعديل إعلاناتك أو حذفها في أي وقت. للاطلاع على بياناتك أو حسابك أو تصحيحها أو حذفها، راسلنا على emarket.contact.drs@gmail.com."],["7. Conservation","7. Retention","7. الاحتفاظ"],["Vos données sont gardées tant que votre compte existe, ou le temps nécessaire pour traiter un signalement ou un litige.","Your data is kept as long as your account exists, or for the time needed to handle a report or a dispute.","تُحفظ بياناتك ما دام حسابك قائمًا، أو للمدة اللازمة لمعالجة بلاغ أو نزاع."],["23 octobre 2026","21 October 2026","21 أكتوبر 2026","21 Oktoobar 2026"]]);

addT([["Cette adresse e-mail est déjà utilisée. Connectez-vous.","This email address is already in use. Sign in.","هذا البريد الإلكتروني مستخدم بالفعل. سجّل الدخول.",""],["Inscription momentanément indisponible. Réessayez plus tard.","Sign-up temporarily unavailable. Try again later.","التسجيل غير متاح مؤقتًا. حاول لاحقًا.",""],["Un code à usage unique a été envoyé à","A one-time code was sent to","تم إرسال رمز لمرة واحدة إلى",""],["🔐 Pour votre sécurité, un code de confirmation à usage unique vous sera envoyé par e-mail à chaque connexion et à chaque inscription.","🔐 For your security, a one-time confirmation code will be emailed to you at every sign-in and sign-up.","🔐 لأمانك، سيتم إرسال رمز تأكيد لمرة واحدة إلى بريدك الإلكتروني عند كل تسجيل دخول وكل تسجيل.",""],["Recevoir mon code", "Get my code", "احصل على الرمز", "Jot sa code"], ["🔐 Pas de mot de passe à retenir : à chaque connexion, vous recevez par e-mail un code à usage unique.", "🔐 No password to remember: each time you sign in, you receive a one-time code by email.", "🔐 لا حاجة لتذكر كلمة مرور: في كل تسجيل دخول تتلقى رمزًا لمرة واحدة عبر البريد الإلكتروني.", ""], ["Code reçu par e-mail", "Code received by email", "الرمز المستلم عبر البريد الإلكتروني", ""], ["Valider le code", "Confirm code", "تأكيد الرمز", ""], ["Renvoyer le code", "Resend code", "إعادة إرسال الرمز", ""], ["Changer d'e-mail", "Change email", "تغيير البريد الإلكتروني", ""], ["Il ne fonctionne qu'une seule fois. Vérifiez aussi vos courriers indésirables (spam).", "It only works once. Also check your spam folder.", "لا يعمل إلا مرة واحدة. تحقق أيضًا من البريد المزعج.", ""], ["Code envoyé.", "Code sent.", "تم إرسال الرمز.", ""], ["Entrez le code reçu.", "Enter the code you received.", "أدخل الرمز الذي استلمته.", ""], ["Code invalide ou expiré.", "Invalid or expired code.", "رمز غير صالح أو منتهي.", ""], ["Aucun compte avec cet e-mail. Créez un compte.", "No account with this email. Create an account.", "لا يوجد حساب بهذا البريد. أنشئ حسابًا.", async function utApi(txt,src,tgt){
 const r=await fetch('https://api.mymemory.translated.net/get?q='+encodeURIComponent(txt)+'&langpair='+src+'|'+tgt);
 const j=await r.json(),t=j&&j.responseData&&j.responseData.translatedText,c=+(j&&j.responseStatus);
 if(c===429||/MYMEMORY WARNING|ALL AVAILABLE FREE/i.test(t||'')){UT.off=true;throw new Error('quota')}

 return res.join(' ')}

const SIMMAP=(()=>{const m=new Map();SIMG.forEach(([t,w,l])=>l.split(' ').forEach(k=>{if(!m.has(k))m.set(k,[]);m.get(k).push([t,w])}));return m})();
const SIMKEYS=[...SIMMAP.keys()].filter(k=>k.length>=6);
const simTok=s=>norm(s).replace(/[^a-z0-9\-]+/g,' ').split(' ').filter(w=>w.length>1);
const near=(a,b)=>{if(Math.abs(a.length-b.length)>1)return false;let i=0,j=0,d=0;while(i<a.length&&j<b.length){if(a[i]===b[j]){i++;j++;continue}if(++d>1)return false;if(a.length>b.length)i++;else if(a.length<b.length)j++;else{i++;j++}}return d+(a.length-i)+(b.length-j)<=1};
const simCache=new Map();
function simInfo(p){
 const key=p.id+'|'+p.nom;let r=simCache.get(key);if(r)return r;
 const toks=simTok(p.nom),sc={};
 toks.forEach(w=>{let hit=SIMMAP.get(w);if(!hit&&w.length>=6){const k=SIMKEYS.find(k=>near(w,k));if(k)hit=SIMMAP.get(k)}
  if(hit)hit.forEach(([t,wt])=>{sc[t]=(sc[t]||0)+wt})});
 if(sc.pc&&sc.tel&&toks.some(w=>['ordinateur','laptop','pc','macbook'].includes(w)))delete sc.tel;   /* « ordinateur portable » ≠ téléphone */
 if(sc.acc)sc.acc+=1;
 let type=null,best=0;for(const t in sc)if(sc[t]>best){best=sc[t];type=t}
 const words=new Set(toks.filter(w=>w.length>2&&!FRW.has(w)&&!/^\d+$/.test(w)));
 r={type,words};simCache.set(key,r);return r;
}
function simScore(p,x){
 const a=simInfo(p),b=simInfo(x);let s=0;
 const sameType=!!(a.type&&b.type&&a.type===b.type);
 if(a.type!==b.type)return 0;                              /* un téléphone n'est jamais proposé à côté d'un sac */
 if(sameType)s+=100;
 let sh=0;a.words.forEach(w=>{if(b.words.has(w))sh++});s+=Math.min(sh,3)*(sameType?12:22);   /* marque, modèle… */
 if(x.categorie===p.categorie)s+=sameType?15:25;else if(!sameType)return 0;
 if(!sameType&&sh<2)return 0;
 const lo=Math.min(p.prix,x.prix),hi=Math.max(p.prix,x.prix),r=hi>0?lo/hi:0;s+=r>=.5?20*r:r<.2?-20:0;     /* prix proche */
 if(norm(p.zone||'')&&norm(p.zone||'')===norm(x.zone||''))s+=10;
 return s;
}
function simPick(p){
 const pool=vis().filter(x=>x.id!==p.id&&x.quantite>0).map(x=>[x,simScore(p,x)]).filter(z=>z[1]>=30).sort((u,v)=>v[1]-u[1]);
 const others=[],seen=new Set(),same=[];
 pool.forEach(([x])=>{if(x.seller_id===p.seller_id){if(same.length<2)same.push(x);return}if(!seen.has(x.seller_id)&&others.length<4){seen.add(x.seller_id);others.push(x)}});

 return {others,same};
}
